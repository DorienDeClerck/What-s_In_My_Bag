<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello!!!</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* Eigen lettertype? Zet het bestand in je repo en haal dit uit commentaar:
  @font-face { font-family: "MijnPixel"; src: url("pixel.woff2") format("woff2"); }
  Pas daarna --font-pixel hieronder aan. */
  :root {
    --font-pixel: "DotGothic16", monospace;
    --blauw: #1c05f5;
    --u: 1vw;                       /* alle maten schalen mee met de schermbreedte */
  }
  @media (max-width: 700px) { :root { --u: 2.2vw; } }

  html, body { margin: 0; height: 100%; background: #000; }
  body { box-sizing: border-box; padding: 2.3vh 0.46vw; }   /* zwarte rand */

  .scherm {
    position: relative;
    height: 100%;
    background: var(--blauw);
    overflow: hidden;
  }

  #tekst {
    position: absolute;
    left: 0; right: 0;
    top: calc(50% - 0.5 * var(--u));
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(1.09 * var(--u));
  }
  .regel { display: flex; height: calc(2.44 * var(--u)); }

  .letter {
    position: relative;
    box-sizing: border-box;
    width: calc(1.332 * var(--u));
    height: 100%;
    background: #fff;
    color: var(--blauw);
    font-family: var(--font-pixel);
    font-size: calc(2.2 * var(--u));
    line-height: calc(2.44 * var(--u));
    text-align: center;
    visibility: hidden;             /* verschijnt pas als hij "getypt" wordt */
  }
  .letter.zichtbaar { visibility: visible; }
  .letter.scheiding { box-shadow: inset 1px 0 0 var(--blauw); }  /* dunne lijntjes */

  /* knipperende typ-cursor op de plek van de volgende letter */
  .letter.cursor::before {
    content: "";
    position: absolute;
    left: calc(0.1 * var(--u));
    top: 12%;
    width: calc(0.2 * var(--u));
    height: 76%;
    background: #fff;
    visibility: visible;
    animation: knipper 0.9s steps(1) infinite;
  }
  @keyframes knipper { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div class="scherm">
    <div id="tekst"></div>
  </div>

<script>
  // ====== INSTELLINGEN ======
  // Per regel: de tekst + de blokjes (aantal letters per wit blokje, zoals op je foto)
  const regels = [
    { tekst: "Hello!!!",                blokjes: [3, 3, 2] },
    { tekst: "My name is Dorien",       blokjes: [1, 3, 3, 4, 3, 3] },
    { tekst: "I made a website!!!!!!!", blokjes: [1, 3, 3, 3, 4, 3, 3, 3] },
    { tekst: "Wanne see??",             blokjes: [1, 3, 4, 3] }
  ];
  const typMin   = 25;     // ms: snelste tijd tussen twee letters
  const typMax   = 70;     // ms: langzaamste tijd (geeft een menselijk typgevoel)
  const leesTijd = 1300;   // ms pauze na elke regel zodat het te lezen is
  const startVertraging = 500;   // ms voor de eerste letter
  // ===========================

  const wacht = ms => new Promise(r => setTimeout(r, ms));
  const willekeurig = (a, b) => a + Math.random() * (b - a);
  const container = document.getElementById("tekst");

  // Lijntjes: eerste letter van elk blokje (behalve het eerste) krijgt een scheiding
  function scheidingen(blokjes) {
    const set = new Set();
    let pos = 0;
    blokjes.forEach((n, i) => { if (i > 0) set.add(pos); pos += n; });
    return set;
  }

  function maakRegel({ tekst, blokjes }) {
    const regel = document.createElement("div");
    regel.className = "regel";
    const sep = scheidingen(blokjes);
    const letters = [...tekst].map((teken, i) => {
      const s = document.createElement("span");
      s.className = "letter" + (sep.has(i) ? " scheiding" : "");
      s.textContent = teken === " " ? "\u00A0" : teken;
      regel.appendChild(s);
      return s;
    });
    container.appendChild(regel);
    return letters;
  }

  async function typRegel(r) {
    const letters = maakRegel(r);
    letters[0].classList.add("cursor");
    await wacht(200);                              // cursor knippert even voor het typen begint

    for (let i = 0; i < letters.length; i++) {
      letters[i].classList.remove("cursor");
      letters[i].classList.add("zichtbaar");
      if (letters[i + 1]) letters[i + 1].classList.add("cursor");
      const extra = r.tekst[i] === " " ? 30 : 0;   // iets langere pauze na een spatie
      await wacht(willekeurig(typMin, typMax) + extra);
    }
  }

  async function start() {
    await wacht(startVertraging);
    for (const r of regels) {
      await typRegel(r);
      await wacht(leesTijd);
    }
  }

  start();
</script>
</body>
</html>
