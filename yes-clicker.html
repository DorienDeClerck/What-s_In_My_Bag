<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YES - Volscherm Tekst Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
        }

        #content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            font-size: 24px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        #button-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        button {
            padding: 20px 80px;
            font-size: 32px;
            font-weight: bold;
            background-color: #00ff00;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.1s ease;
        }

        button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        button:hover {
            background-color: #00dd00;
        }

        .text-block {
            margin-bottom: 20px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 5px solid #00ff00;
            border-radius: 5px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div id="content"></div>
    <div id="button-container">
        <button onclick="addText()">YES</button>
    </div>

    <script>
        let clickCount = 0;

        const textBlocks = [
            "JE HEBT GEKLIKT OP YES",
            "MEER TEKST VERSCHIJNT HIER NOG MEER WOORDEN VOEGEN ZICH ERBIJ ELKE KEER",
            "HET SCHERM VULT ZICH MET ALLES WAT JE ZIET GROEIT EN GROEIT MET ELKE KLIK",
            "DE TEKST BLIJFT STAAN NIKS VERDWIJNT ALLES ACCUMULEERT EN STAPELT ZICH OP",
            "KLIK MAAR DOOR JE KRIJGT STEEDS MEER CONTENT DE HELE PAGINA WORDT GEVULD",
            "DEZE PAGINA BREIDT ZICH OUT MET ELKE DRUK OP DE YES KNOP NIETS GAAT WEG",
            "VOLSCHERM DISPLAY ALLE WOORDEN BLIJVEN ZICHTBAAR ALLES GROEIT MEEENORMAAL",
            "JE BENT AL BEHOORLIJK VER MAAR ER KAN NOG VEEL MEER TEKST BIJ BLIJF KLIKKEN",
            "DE CONTENT VULT LANGZAAM HET HELE SCHERM NIKS VERDWIJNT ALLES BLIJFT HANGEN",
            "NOG MEER WOORDEN DEZE ZIN IS LANGER OMDAT JE MEER MOET LEZEN ELKE KLIK GEEFT JE MEER",
            "HET SCHERM WORDT VOLLER EN VOLLER MET TEKST JE KUNT SCROLLENV MAAR ALLES BLIJFT STAAN",
            "PAGINA NA PAGINA MET WOORDEN DIE ZICH OPSTAPELEN NIETS VERDWIJNT ALLES BLIJFT VOOR ALTIJD",
            "JE BENT NU AAN HET SCROLLEN OMDAT ER ZO VEEL TEKST IS DIT WAS JE PLAN TOCH",
            "STEEDS MEER CONTENT GROEIT DEN BERG WOORDEN HOGER EN HOGER MET ELKE MUISKLIK",
            "GROEN VLAK ONDERAAN VOOR JE VINGERS KLAAR OM NOG MEER CONTENT IN TE LADEN",
            "DUIZENDEN WOORDEN KRIJG JE ER BIJ MET ELKE YES DRUK JE VULT JE SCHERM LETTERLIJK",
            "NIKS VERDWIJNT NIKS GAAT WEG ALLES ACCUMULEERT HIER OP DEZE ENORME PAGINA",
            "MEGA LETTERS GROTE WOORDEN RIJEN TEKST DIE ZICH EINDELOOS VOORTZETTEN",
            "JE SCROLLT NU WAARSCHIJNLIJK AL VEEL OMDAT ER ZOVEEL IS GEWORDEN GAUW MEER",
            "TEKST TEKST TEKST OVERAL TEKST JE HELE SCHERM IS VOL ERMEE EN ER KAN NOG VEEL MEER",
            "KLIK GEWOON DOOR WE GAAN HELEMAAL GOED HIER ALLES IS VOORGEPROGRAMMEERD",
            "ONEINDIG VEEL BLOKKEN MET INHOUD WACHTEN OP JE DRUK OP DIE GROENE KNOP",
            "VOLLEDIGE BEDEKKNG VAN JE VIEWPORT ZE WORDEN GROTER EN MEER NAARMATE JE DOORGAAT",
            "JE BENT MISSCHIEN AL MOEGETONGEN MAAR HIER KOMT NOG VEEL VEEL MEER TEXT",
            "BLIJF KLIKKEN VOOR MEER WALLA WE DOEN DIT TOT JE SCHERM BARST VAN DE WOORDEN"
        ];

        function addText() {
            const content = document.getElementById('content');
            
            if (clickCount < textBlocks.length) {
                const block = document.createElement('div');
                block.className = 'text-block';
                block.textContent = textBlocks[clickCount];
                content.appendChild(block);
                clickCount++;
            } else {
                // Repeat cycle with variation
                const extraBlock = document.createElement('div');
                extraBlock.className = 'text-block';
                extraBlock.textContent = `RONDE ${Math.floor(clickCount / textBlocks.length) + 1}: ${textBlocks[clickCount % textBlocks.length]}`;
                content.appendChild(extraBlock);
                clickCount++;
            }

            // Auto-scroll to bottom
            content.scrollTop = content.scrollHeight;
        }
    </script>
</body>
</html>
