<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's in my bag?</title>
<style>

  :root{
    --f: min(1vw, 1.08vh);            /* basis-eenheid: schaalt mee met het scherm (zoals in je ontwerp) */
    --blauw:#0000f5;
    --lijn: max(1px, calc(.08 * var(--f)));
    --u: calc(var(--f) * 1.292);       /* eenheid voor de pixel-letters */
    --rij: calc(4.35 * var(--f));      /* hoogte van elke rij in het kader */
    --sans: "Helvetica Neue","HelveticaNeue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  a{color:inherit;text-decoration:none}

  .kader{position:fixed;top:calc(2.6 * var(--f));bottom:calc(2.6 * var(--f));left:1.85vw;right:1.85vw;
    border:var(--lijn) solid var(--blauw);display:flex;flex-direction:column;color:var(--blauw);
    font-family:var(--sans);font-weight:300;font-size:calc(2.85 * var(--f));line-height:var(--rij);background:#fff}
  .kop{display:flex;height:var(--rij);flex:none;border-bottom:var(--lijn) solid var(--blauw)}
  .kop .home{width:calc(10.95 * var(--f));border-right:var(--lijn) solid var(--blauw);padding-left:calc(1.35 * var(--f))}
  .kop .vul{flex:1}
  .kop .nr{width:calc(5.15 * var(--f));border-left:var(--lijn) solid var(--blauw);padding-left:calc(1.15 * var(--f))}

  .midden{position:relative;flex:1;min-height:0}
  .scherm{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
  .scherm::-webkit-scrollbar{display:none}
  .pijl{position:absolute;top:0;height:var(--rij);background:#fff;z-index:3;display:flex;align-items:center;justify-content:center}
  .pijl svg{width:calc(4.4 * var(--f));height:calc(1.5 * var(--f));display:block;overflow:visible}
  .pijl.l{left:0;width:calc(5.9 * var(--f));border-right:var(--lijn) solid var(--blauw);border-bottom:var(--lijn) solid var(--blauw)}
  .pijl.r{right:0;width:calc(5.85 * var(--f));border-left:var(--lijn) solid var(--blauw);border-bottom:var(--lijn) solid var(--blauw)}
  .pijl.uit{cursor:default}
  .pijl:not(.uit){cursor:pointer}

  .menu{flex:none;border-top:var(--lijn) solid var(--blauw)}
  .menu .m{display:flex;align-items:center;height:var(--rij);padding-left:calc(1.3 * var(--f));border-bottom:var(--lijn) solid var(--blauw)}
  .menu .m:last-child{border-bottom:0}
  .menu a.m{cursor:pointer}
  .menu .t{display:inline-block;line-height:1.05;padding-bottom:.05em;
    background:linear-gradient(currentColor,currentColor) no-repeat 0 calc(100% - .02em) / 0 max(1px,.045em);
    transition:background-size .55s ease}
  .menu .t.onderlijnd{background-size:100% max(1px,.045em)}

  .doek{position:relative;width:100%;max-width:calc(96.3 * var(--f));margin:0 auto;padding-top:var(--rij);padding-bottom:calc(3 * var(--f))}
  /* de parelstitel blijft altijd volledig zichtbaar */
  .titel{position:absolute;left:calc(9.55 * var(--f));top:calc(1.55 * var(--f));width:calc(73.6 * var(--f));height:auto;
    mix-blend-mode:multiply;pointer-events:none;z-index:0}
  .blok{position:relative;display:flow-root;z-index:1;transition:margin-top .55s ease}
  .b1{min-height:calc(27.8 * var(--f))}
  /* de tas blijft altijd op dezelfde plek; de tekst begint onder de parelstitel */
  .b2{min-height:calc(21 * var(--f))}

  .fig{margin:0;position:relative;width:calc(23.4 * var(--f))}
  .fig.links{float:left;margin:calc(12.8 * var(--f)) calc(1.3 * var(--f)) 0 calc(4.8 * var(--f))}
  .fig.rechts{float:right;margin:calc(3 * var(--f)) calc(7 * var(--f)) calc(1 * var(--f)) calc(1.3 * var(--f))}
  .fig figcaption{height:calc(2 * var(--f));line-height:calc(2 * var(--f));font-size:calc(1.9 * var(--f));font-style:italic;font-weight:300;color:var(--blauw)}
  .fig.rechts figcaption{text-align:right}
  .tas{display:block;position:relative;width:100%;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .tas img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;user-select:none;-webkit-user-drag:none;transition:opacity .5s ease}
  .tas img.open{position:absolute;inset:0;height:100%;opacity:0}
  .blok.open .tas img.open{opacity:1}
  .blok.open .tas img.dicht{opacity:0}
  .clipwrap{position:absolute;pointer-events:none;display:block}
  .clip{display:block;width:100%;height:100%;overflow:visible}
  .clip .d{stroke:#6f6f6f;stroke-width:2.1}
  .clip .h{stroke:#dcdcdc;stroke-width:.7}
  .c1{left:calc(3.1 * var(--f));top:calc(1.15 * var(--f));width:calc(1.8 * var(--f));height:calc(3.9 * var(--f))}
  .c2{left:calc(21.4 * var(--f));top:calc(13.6 * var(--f));width:calc(1.8 * var(--f));height:calc(3.9 * var(--f));transform:rotate(100deg)}

  /* tekst naast de tas: verschijnt pas als je de tas aantikt (zelfde plek als in je screenshot) */
  .lijst{display:none;margin:0;padding:0 calc(5.9 * var(--f)) 0 0;font-size:calc(5 * var(--f));line-height:calc(6.73 * var(--f));font-weight:400;text-transform:uppercase;max-width:calc(80 * var(--f))}
  .b1 .lijst{padding-top:calc(10.5 * var(--f));padding-left:calc(6.3 * var(--f));font-size:calc(5.3 * var(--f));max-width:none}
  .b2 .lijst{padding-left:calc(5.9 * var(--f))}
  .blok.open .lijst{display:block;animation:in .45s ease both}
  @keyframes in{from{opacity:0;transform:translateY(.6em)}to{opacity:1;transform:none}}
  .it .w{white-space:nowrap}
  .w{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-transform:inherit;-webkit-tap-highlight-color:transparent;
    text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:.07em;text-underline-offset:.1em;transition:text-decoration-color .3s}
  .w.aan{text-decoration-color:var(--blauw)}

  /* losse voorwerpen: verschijnen als je het woord aantikt */
  .streu{display:none;clear:both;position:relative;margin-top:calc(.6 * var(--f))}
  .s1{height:calc(26.5 * var(--f))}
  .s2{height:calc(47.5 * var(--f))}
  .blok.open .streu{display:block}
  .item{position:absolute;height:auto;mix-blend-mode:multiply;opacity:0;transform:scale(.72);transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.4,.4,1);pointer-events:none;user-select:none}
  .item.zie{opacity:1;transform:none}

</style>
</head>
