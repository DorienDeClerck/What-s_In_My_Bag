<title>What's in my bag?</title>
<style>

  :root{
    --f: min(1vw, 1.08vh);            /* basis-eenheid: schaalt mee met het scherm (zoals in je ontwerp) */
    --blauw:#0000f5;
    --lijn: max(1px, calc(.08 * var(--f)));
    --u: calc(var(--f) * 1.292);       /* eenheid voor de pixel-letters */
    --rij: calc(4.35 * var(--f));      /* hoogte van elke rij in het kader */
    --sans: "Helvetica Neue","HelveticaNeue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  a{color:inherit;text-decoration:none}

  .kader{position:fixed;top:calc(2.6 * var(--f));bottom:calc(2.6 * var(--f));left:1.85vw;right:1.85vw;
    border:var(--lijn) solid var(--blauw);display:flex;flex-direction:column;color:var(--blauw);
    font-family:var(--sans);font-weight:300;font-size:calc(2.85 * var(--f));line-height:var(--rij);background:#fff}
  .kop{display:flex;height:var(--rij);flex:none;border-bottom:var(--lijn) solid var(--blauw)}
  .kop .home{width:calc(10.95 * var(--f));border-right:var(--lijn) solid var(--blauw);padding-left:calc(1.35 * var(--f))}
  .kop .vul{flex:1}
  .kop .nr{width:calc(5.15 * var(--f));border-left:var(--lijn) solid var(--blauw);padding-left:calc(1.15 * var(--f))}

  .midden{position:relative;flex:1;min-height:0}
  .scherm{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
  .scherm::-webkit-scrollbar{display:none}
  .pijl{position:absolute;top:0;height:var(--rij);background:#fff;z-index:3;display:flex;align-items:center;justify-content:center}
  .pijl svg{width:calc(4.4 * var(--f));height:calc(1.5 * var(--f));display:block;overflow:visible}
  .pijl.l{left:0;width:calc(5.9 * var(--f));border-right:var(--lijn) solid var(--blauw);border-bottom:var(--lijn) solid var(--blauw)}
  .pijl.r{right:0;width:calc(5.85 * var(--f));border-left:var(--lijn) solid var(--blauw);border-bottom:var(--lijn) solid var(--blauw)}
  .pijl.uit{cursor:default}
  .pijl:not(.uit){cursor:pointer}

  .menu{flex:none;border-top:var(--lijn) solid var(--blauw)}
  .menu .m{display:flex;align-items:center;height:var(--rij);padding-left:calc(1.3 * var(--f));border-bottom:var(--lijn) solid var(--blauw)}
  .menu .m:last-child{border-bottom:0}
  .menu a.m{cursor:pointer}
  .menu .t{display:inline-block;line-height:1.05;padding-bottom:.05em;
    background:linear-gradient(currentColor,currentColor) no-repeat 0 calc(100% - .02em) / 0 max(1px,.045em);
    transition:background-size .55s ease}
  .menu .t.onderlijnd{background-size:100% max(1px,.045em)}

  .doek{position:relative;width:100%;max-width:calc(96.3 * var(--f));margin:0 auto}
  .ring{position:relative;width:100%;height:calc(66 * var(--f));overflow:hidden;touch-action:pan-y;cursor:grab}
  .ring .r{position:absolute;left:0;top:0;height:auto;mix-blend-mode:multiply;user-select:none;-webkit-user-drag:none;pointer-events:none;will-change:transform}
  .ring .titel4{position:absolute;left:50%;top:50%;width:calc(50 * var(--f));transform:translate(-50%,-44%);mix-blend-mode:multiply;pointer-events:none;z-index:0}

</style>

<script>
(function(){
  var ring=document.querySelector('.ring'),els=[].slice.call(ring.querySelectorAll('.r')),n=els.length;
  var ang=0,speed=.00012,drag=false,lx=0,vel=0,last=performance.now();
  function f(){return Math.min(window.innerWidth*.01,window.innerHeight*.0108)}
  function draw(){
    var F=f(),W=ring.clientWidth,H=ring.clientHeight,cx=W/2,cy=H*.5,rx=Math.min(W*.44,44*F),ry=H*.34;
    els.forEach(function(el,i){
      var a=ang*Math.PI*2+i/n*Math.PI*2, c=Math.cos(a), s=Math.sin(a);
      var near=(c+1)/2;               /* 1 = vooraan (boven), 0 = achteraan (onder) */
      var sc=.38+.9*near, w=parseFloat(el.dataset.w)*F*sc;
      el.style.width=w+'px';
      var h=el.naturalHeight&&el.naturalWidth?w*el.naturalHeight/el.naturalWidth:w;
      var x=cx+rx*s-w/2, y=cy-ry*c-h/2+ry*.1;
      el.style.transform='translate('+x+'px,'+y+'px)';
      el.style.zIndex=Math.round(near*100);
      el.style.opacity=.55+.45*near;
    });
  }
  function tick(t){var dt=t-last;last=t; if(!drag){ang+=speed*dt+vel; vel*=.95;} draw(); requestAnimationFrame(tick);}
  ring.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ring.style.cursor='grabbing';ring.setPointerCapture(e.pointerId)});
  ring.addEventListener('pointermove',function(e){if(!drag)return;var d=(e.clientX-lx)/ring.clientWidth*.5;ang+=d;vel=d;lx=e.clientX});
  function up(){drag=false;ring.style.cursor='grab'}
  ring.addEventListener('pointerup',up);ring.addEventListener('pointercancel',up);
  window.addEventListener('resize',draw);
  els.forEach(function(e){e.addEventListener('load',draw)});
  requestAnimationFrame(tick);
})();
</script>
