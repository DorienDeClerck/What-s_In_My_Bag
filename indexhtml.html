<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's in my bag — Dorien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,300;100,400;125,900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0000EE;
    --white:#ffffff;
    --bg:var(--white);
    --fg:var(--blue);
    --pad:2.2vw;
    --bar:3.5vh;
    --line:1.5px;
  }
  body.dark{ --bg:var(--blue); --fg:var(--white); }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);transition:background-color .6s ease;overscroll-behavior:none}
  body{font-family:"Archivo",Helvetica,Arial,sans-serif;color:var(--fg);touch-action:none}

  /* the page itself never scrolls */
  .stage{position:fixed;inset:0;background:var(--bg);transition:background-color .6s ease,color .6s ease}
  .frame{
    position:absolute;inset:var(--pad);
    border:var(--line) solid var(--fg);
    transition:border-color .6s ease;
    display:flex;flex-direction:column;
  }
  .bar{
    height:var(--bar);min-height:34px;flex:none;
    border-bottom:var(--line) solid var(--fg);
    display:flex;justify-content:space-between;align-items:stretch;
    transition:border-color .6s ease;
  }
  .tab{
    display:flex;align-items:center;
    padding:0 1.1vw;
    font-stretch:100%;font-weight:300;
    font-size:clamp(14px,2.1vh,26px);
    letter-spacing:.01em;
    color:var(--fg);text-decoration:none;
    transition:color .6s ease,border-color .6s ease;
  }
  .tab.home{border-right:var(--line) solid var(--fg)}
  .tab.info{border-left:var(--line) solid var(--fg);font-variant-numeric:tabular-nums;min-width:6.5em;justify-content:center}

  .content{flex:1;min-height:0;position:relative;overflow:hidden}

  /* ---------- editions ---------- */
  /* all editions sit side by side on one long sheet; the frame is a window that glides over it */
  .sheet{
    position:absolute;inset:0;
    display:flex;width:calc(100% * var(--count,5));
    transition:transform 1.1s cubic-bezier(.65,0,.35,1);
    will-change:transform;
  }
  .sheet.instant{transition:none}
  .edition{position:relative;flex:0 0 calc(100% / var(--count,5));height:100%;padding:4vh 3.7vw 0 3.8vw;overflow:hidden}

  /* outline type (light) */
  .outline{color:transparent;-webkit-text-stroke:var(--line) var(--fg)}

  /* ========== EDITIE 01 — intro ========== */
  #e1{display:flex;align-items:center}
  .intro{
    font-stretch:100%;font-weight:400;
    font-size:var(--ifs,60px);
    line-height:1.13;
    letter-spacing:-.01em;
    text-transform:uppercase;
    white-space:pre;
    margin-left:-.04em;
    color:transparent;
    -webkit-text-stroke:clamp(.6px,.016em,1.5px) var(--fg);
  }
  .intro .ln{display:block;min-height:1.13em}
  .intro .gap{min-height:1.13em}
  .intro .choice{margin-top:.12em}
  .ch{opacity:0}
  .ch.v{opacity:1}
  .caret{
    display:inline-block;width:.06em;height:.82em;margin-left:.04em;
    background:var(--fg);vertical-align:-.04em;
    animation:blink .9s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  .intro button{
    font:inherit;letter-spacing:inherit;text-transform:inherit;
    background:none;border:0;padding:0;margin:0;
    color:transparent;-webkit-text-stroke:inherit;
    cursor:pointer;
  }
  .intro .yes:hover .ch.v, .intro .yes:focus-visible .ch.v{color:var(--fg)}
  .intro button:focus-visible{outline:2px dashed var(--fg);outline-offset:4px}
  .intro .slash{font-weight:300}
  .no{display:inline-block;transition:left .28s cubic-bezier(.3,1.4,.5,1), top .28s cubic-bezier(.3,1.4,.5,1)}
  .no.loose{position:absolute;z-index:5;white-space:pre}
  .confetti{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;left:0;top:0;width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
    border-radius:50%;background:var(--blue);will-change:transform,opacity}
  .intro.typing button{pointer-events:none}

  /* ========== HOME — overzicht van alle edities ========== */
  #e0{display:flex;align-items:center;justify-content:center;padding:1vh 1vw 0}
  .rackhome{width:100%;height:100%;display:block;overflow:visible}
  .rackhome .homeart{fill:var(--fg);pointer-events:none}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .rw{cursor:pointer;outline:none}
  .rw text{font-family:"Archivo",Helvetica,Arial,sans-serif;font-weight:400;font-stretch:100%;letter-spacing:0;
    fill:transparent;stroke:var(--fg);stroke-width:1.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round;
    transition:fill .2s ease}
  .rw .hit{fill:transparent;stroke:none;pointer-events:all}
  .rw:hover text,.rw:focus-visible text{fill:var(--fg)}
  .rackhome.wait .rw{opacity:0}
  .rw{transition:opacity .4s ease}
  .index{
    list-style:none;
    font-stretch:100%;font-weight:400;text-transform:uppercase;
    font-size:var(--xfs,60px);line-height:1;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
    margin-left:-.06em;
  }
  .index button{
    font:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left;
    background:none;border:0;padding:0;cursor:pointer;white-space:pre;
    color:transparent;-webkit-text-stroke:clamp(.6px,.012em,1.5px) var(--fg);
    transition:color .2s;
  }
  .index button:hover,.index button:focus-visible{color:var(--fg);outline:none}
  .index .soon-t{opacity:.55}



  /* ========== EDITIE 02 — SHAKE THAT BAG ========== */
  #e2{display:flex;align-items:center;justify-content:center;padding:1.5vh 1vw 0}
  .shk{position:relative;width:min(100%, calc((100vh - var(--pad)*2 - var(--bar) - 9vh) * 1.594));aspect-ratio:2410 / 1512}
  .shk-type{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .shk-type text{font-family:"Archivo",Helvetica,Arial,sans-serif;font-weight:900;font-stretch:125%;font-size:640px;
    fill:none;stroke:var(--fg);stroke-width:2.6px;vector-effect:non-scaling-stroke}
  .loot{position:absolute;height:auto;z-index:3;opacity:0;pointer-events:none;
    transform:scaleX(var(--flip,1));will-change:transform,opacity}
  .loot.out{opacity:1}
  .sbag{position:absolute;height:auto;z-index:2;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none;
    transform-origin:50% 20%;will-change:transform}
  .sbag.held{cursor:grabbing}
  .sbag.home{transition:left .8s cubic-bezier(.3,1.3,.5,1), top .8s cubic-bezier(.3,1.3,.5,1), width .8s cubic-bezier(.3,1.3,.5,1), transform .5s}
  .sbag.idle{animation:wiggle 2.8s ease-in-out infinite}
  @keyframes wiggle{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(-3deg)}90%{transform:rotate(3deg)}94%{transform:rotate(-2deg)}97%{transform:rotate(1deg)}}
  .shake-ui{background:none;border:0;color:var(--fg);font:inherit;font-weight:300;font-size:clamp(11px,1.5vh,16px);
    letter-spacing:.08em;text-transform:uppercase;padding:.4em .6em}
  button.shake-ui{cursor:pointer;text-decoration:underline;text-underline-offset:.25em;text-decoration-thickness:1px}
  .shake-ui[hidden]{display:none}
  /* ========== EDITIE 04 — DE HANDELING: typ items in de tas ========== */
  #e4{display:flex;align-items:center;justify-content:center;cursor:text;padding-top:0}
  .bagstage{width:min(100%, calc((100vh - var(--pad)*2 - var(--bar) - 7vh) * 1.7209));aspect-ratio:2306 / 1340;position:relative}
  .bagstage svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
  .bagstage .draw{fill:var(--fg);transition:opacity .5s ease}
  .bagstage .draw.open{opacity:0}
  .bagstage.isopen .draw.open{opacity:1}
  .bagstage.isopen .draw.closed{opacity:0}
  .bagstage .wtxt{
    font-family:"Archivo",Helvetica,Arial,sans-serif;font-weight:400;font-stretch:100%;
    text-transform:uppercase;letter-spacing:-.01em;
    fill:none;stroke:var(--fg);
    text-anchor:middle;dominant-baseline:central;
  }
  .typing-now{
    position:absolute;z-index:4;pointer-events:none;white-space:pre;
    font-weight:400;text-transform:uppercase;font-size:clamp(18px,4.2vh,48px);line-height:1;
    color:transparent;-webkit-text-stroke:clamp(.6px,.016em,1.5px) var(--fg);
    transform:translate(12px,-50%);
  }
  .typing-now .ph{-webkit-text-stroke:0;color:var(--fg);opacity:.45;font-size:.42em;letter-spacing:.08em;vertical-align:.5em}
  .typing-now .caret{display:inline-block;width:.06em;height:.82em;margin-left:.04em;background:var(--fg);vertical-align:-.04em;animation:blink .9s steps(1) infinite}
  .type-input{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
  .mid{display:grid;align-self:center;justify-items:center}
  .mid > *{grid-area:1 / 1}
  .empty{
    background:none;border:0;cursor:pointer;color:var(--fg);
    font:inherit;font-weight:300;font-size:clamp(12px,1.9vh,22px);letter-spacing:0;text-transform:uppercase;
    padding:.3em .6em;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:.2em;text-decoration-thickness:1px;
  }
  .empty:hover{text-decoration-color:var(--fg)}
  .empty[hidden]{display:none}

  /* ========== placeholders ========== */
  .soon{display:flex;align-items:center}
  .soon p{
    font-stretch:100%;font-weight:400;text-transform:uppercase;
    font-size:min(9vh,6vw);line-height:1.13;letter-spacing:-.01em;
  }

  /* ========== EDITIE 05 — the bag clock ========== */
  #e5{display:grid;grid-template:1fr / 1fr}
  #e5 > *{grid-area:1 / 1}
  .list{
    align-self:end;justify-self:start;
    list-style:none;position:relative;z-index:1;
    font-size:var(--fs,40px);
  }
  .list li{
    font-stretch:125%;font-weight:900;
    line-height:1.21;text-transform:uppercase;white-space:nowrap;
    letter-spacing:-.005em;
    opacity:0;transform:translateY(.25em);
    animation:in .35s ease forwards;
  }
  .list li .slash{font-weight:300;font-stretch:100%;margin-left:.15em}
  @keyframes in{to{opacity:1;transform:none}}
  body:not(.dark) .list li{color:transparent;-webkit-text-stroke:var(--line) var(--blue)}
  body.dark .list li{color:var(--white);-webkit-text-stroke:0}

  .clock-wrap{display:flex;justify-content:flex-end;align-items:center;height:100%;min-height:0;position:relative;z-index:2;pointer-events:none}
  .clock{width:min(73.5vh,46vw);height:auto;display:block;overflow:visible}
  .clock .face{fill:none;stroke:var(--fg);stroke-width:1.5;vector-effect:non-scaling-stroke;transition:stroke .6s ease}
  .clock .hand{fill:var(--fg);transition:fill .6s ease}

  /* ---------- footer arrows ---------- */
  .foot{flex:none;display:flex;justify-content:center;align-items:flex-end;padding:0 1.3vw 2.2vh;min-height:5.5vh}
  .arrow{background:none;border:0;cursor:pointer;color:var(--fg);padding:1vh .8vw;transition:color .6s ease,opacity .3s}
  .arrow svg{width:clamp(36px,3vw,64px);height:auto;display:block}
  .arrow.prev{margin-bottom:.8vh}
  .arrow[disabled]{opacity:0;pointer-events:none}
  .arrow:focus-visible,.tab:focus-visible{outline:2px dashed var(--fg);outline-offset:3px}
  .hint{
    align-self:center;font-weight:300;font-size:clamp(11px,1.5vh,16px);letter-spacing:.08em;
    text-transform:uppercase;opacity:.7;transition:opacity .6s ease;pointer-events:none;
  }
  .hint.gone{opacity:0}

  /* ---------- portrait / phone ---------- */
  @media (max-aspect-ratio: 1/1){
    .edition{padding:3vh 6vw 0}
    #e5 .clock-wrap{align-items:flex-start}
    .clock{width:min(70vw,48vh)}
  }
  @media (prefers-reduced-motion: reduce){
    .list li{animation:none;opacity:1;transform:none}
    .sheet{transition:none}
  }
</style>
</head>

     <div class="sheet instant" id="sheet">

      <!-- ===== HOME ===== -->
      <section class="edition" id="e0" data-n="0" aria-label="Home">

<script>
/* =====================================================================
   NAVIGATIE TUSSEN EDITIES
   ===================================================================== */
const LAST_EDITION = 10;
let edition = -1;  // 0 = HOME, 1–10 = editions
const pad2 = n => String(n).padStart(2,'0');
const infoEl = document.getElementById('info');
const hint = document.getElementById('hint');

const hashFor = n => n === 0 ? '#home' : '#editie-' + pad2(n);
function goTo(n){
  n = Math.min(LAST_EDITION, Math.max(0, n));
  if(location.hash !== hashFor(n)) location.hash = hashFor(n).slice(1);
  else show(n);
}
const sheet = document.getElementById('sheet');
sheet.style.setProperty('--count', LAST_EDITION + 1);   // HOME + 10 editions
let firstShow = true, introDelay = null;
function show(n){
  const from = edition;
  edition = n;
  // glide the sheet to the right part
  sheet.style.transform = `translateX(${-n * 100 / (LAST_EDITION + 1)}%)`;
  if(firstShow){ sheet.getBoundingClientRect(); sheet.classList.remove('instant'); firstShow = false; }
  document.querySelectorAll('.edition').forEach(s => {
    const here = +s.dataset.n === n;
    s.classList.toggle('on', here);
    s.inert = !here;
  });
  document.body.classList.remove('dark');
  hint.classList.add('gone');
  infoEl.textContent = n === 0 ? 'INDEX' : 'EDITIE ' + pad2(n);
  if(n === 0) fitIndex();
  clearTimeout(introDelay);
  if(n === 1){
    if(from >= 0 && from !== 1){ stopIntro(); buildIntro(); fitIntro(); introDelay = setTimeout(startIntro, 900); }
    else startIntro();
  }
  // leave the typed text alone when gliding away, so it's still there on the sheet
  if(n === 5) enterClock();
  enterBag(n === 4);
  enterShake(n === 2);
}
function fromHash(){
  if(location.hash === '#home') return show(0);
  const m = /^#editie-(\d{1,2})$/.exec(location.hash);
  show(m ? Math.min(LAST_EDITION, Math.max(1, +m[1])) : 1);
}
addEventListener('hashchange', fromHash);
document.getElementById('home').addEventListener('click', e=>{ e.preventDefault(); goTo(0); });

/* ---- HOME: de woorden liggen gestapeld in het rek ----
   Elk woord is een knop naar zijn editie. De stapel wordt berekend zodat
   elk woord echt kan blijven liggen (zwaartepunt tussen de steunpunten).
   Coördinaten = pixels van de originele foto van het rek. */
const RACK_WORDS = [            // in de volgorde waarin ze neergelegd worden: tekst, editie, gewenste hoek, verschuiving
  { t:'TWEE SCHERMEN', go:3, a:  4, dx:   0 },
  { t:'BEELD',         go:2, a:  4, dx:-150 },   // klein blokje links eronder…
  { t:'DE HANDELING',  go:4, a: 12, dx:   0 },   // …zodat dit woord schuin ligt
  { t:'TEKST',         go:1, a: -8, dx: 150 },
  { t:'SCROLL = TIJD', go:5, a: -5, dx:   0 },
  { t:'DE PLAATS',     go:6, a:  9, dx: -60 },
];
// binnenkant van de getekende kast, tussen de buitenste staanders (pixels van de tekening)
const IN = { x0:2266, x1:2758, top:880 };
const SHELF = { x0:2262, x1:2762, y:x => 1548 + 0.012 * (x - 2262) };   // de onderste plank van de kast
const rackSvg = document.getElementById('rackhome');
const rackWordsG = document.getElementById('rackWords');
const SVGNS0 = 'http://www.w3.org/2000/svg';
const FONT = 'Archivo, Helvetica, Arial, sans-serif';
let rackBuilt = false;

function profile(w, h, deg){    // onder- en bovenkant van een gedraaide rechthoek, per kolom
  const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  const bot = new Map(), top = new Map();
  const add = (lx, ly) => { const x = Math.round(lx*c - ly*s), y = lx*s + ly*c;
    if(!bot.has(x) || y > bot.get(x)) bot.set(x, y);
    if(!top.has(x) || y < top.get(x)) top.set(x, y); };
  for(let u = -w/2; u <= w/2; u += 1.5){ add(u, -h/2); add(u, h/2); }
  for(let v = -h/2; v <= h/2; v += 1.5){ add(-w/2, v); add(w/2, v); }
  let xmin = Infinity, xmax = -Infinity, ymin = Infinity;
  for(const [x, y] of top){ xmin = Math.min(xmin, x); xmax = Math.max(xmax, x); ymin = Math.min(ymin, y); }
  return { bot, top, xmin, xmax, ymin };
}

// probeer alle woorden te stapelen met lettergrootte E; geeft null als er één niet in het rek past
function layout(E, ctx){
  ctx.font = `400 ${E}px ${FONT}`;
  const X0 = IN.x0 - 15, sky = new Float64Array(IN.x1 - IN.x0 + 40).fill(Infinity);
  for(let x = SHELF.x0; x <= SHELF.x1; x++) if(x - X0 < sky.length) sky[x - X0] = SHELF.y(x);
  const mid = (IN.x0 + IN.x1) / 2, out = [];
  for(const w of RACK_WORDS){
    const m = ctx.measureText(w.t);
    const iw = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
    const ih = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
    let best = null;
    for(let a = -70; a <= 70; a += 1){
      const p = profile(iw + ih*0.1, ih * 1.28, a);
      for(let off = -260; off <= 260; off += 6){
        const cx = Math.round(mid + w.dx + off);
        if(cx + p.xmin < IN.x0 || cx + p.xmax > IN.x1) continue;            // moet binnen het rek blijven
        let Y = Infinity;
        for(const [x, b] of p.bot) Y = Math.min(Y, sky[cx + x - X0] - b);
        if(!isFinite(Y) || Y + p.ymin < IN.top) continue;
        let lo = Infinity, hi = -Infinity;
        for(const [x, b] of p.bot) if(sky[cx + x - X0] - (Y + b) < 3){ lo = Math.min(lo, cx + x); hi = Math.max(hi, cx + x); }
        const rests = lo + 8 < cx && cx < hi - 8;                                   // ligt op 2+ punten
        const leanR = cx >= hi - 8 && cx + p.xmax > IN.x1 - 4 && a < 0;              // leunt tegen de rechterpaal
        const leanL = cx <= lo + 8 && cx + p.xmin < IN.x0 + 4 && a > 0;              // leunt tegen de linkerpaal
        if(!rests && !leanR && !leanL) continue;                                       // zou omvallen
        const cost = Math.abs(a - w.a) + 0.02 * Math.abs(off);
        if(!best || cost < best.cost) best = { cost, a, cx, cy: Y, p };
      }
    }
    if(!best) return null;
    for(const [x, t] of best.p.top) sky[best.cx + x - X0] = Math.min(sky[best.cx + x - X0], best.cy + t);
    out.push({ w, m, iw, ih, ...best });
  }
  return out;
}

function buildRack(){
  if(rackBuilt) return; rackBuilt = true;
  const ctx = document.createElement('canvas').getContext('2d');
  // zo groot mogelijk, zolang alles in het rek past
  let E = 200, placedWords = null;
  while(E > 8 && !(placedWords = layout(E, ctx))) E *= 0.95;
  if(!placedWords) return;
  placedWords.forEach(({ w, m, iw, ih, a, cx, cy }) => {
    const g = document.createElementNS(SVGNS0, 'g');
    g.setAttribute('class', 'rw'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'link');
    g.setAttribute('aria-label', pad2(w.go) + ' ' + w.t);
    g.setAttribute('transform', `rotate(${a} ${cx} ${cy})`);
    const hit = document.createElementNS(SVGNS0, 'rect');
    hit.setAttribute('class', 'hit');
    hit.setAttribute('x', cx - iw/2 - 6); hit.setAttribute('y', cy - ih/2 - 6);
    hit.setAttribute('width', iw + 12); hit.setAttribute('height', ih + 12);
    const tx = document.createElementNS(SVGNS0, 'text');
    tx.setAttribute('x', cx - iw/2 + m.actualBoundingBoxLeft);
    tx.setAttribute('y', cy - ih/2 + m.actualBoundingBoxAscent);
    tx.style.fontSize = E + 'px';
    tx.textContent = w.t;
    g.append(hit, tx);
    g.addEventListener('click', () => goTo(w.go));
    g.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goTo(w.go); } });
    rackWordsG.appendChild(g);
  });
  rackSvg.classList.remove('wait');
}
function fitIndex(){
  if(rackBuilt) return;
  if(document.fonts && document.fonts.load) document.fonts.load('400 100px Archivo').then(buildRack, buildRack);
  else buildRack();
}

/* =====================================================================
   EDITIE 01 — tekst die letter per letter getypt wordt
   ===================================================================== */
const INTRO = [
  "HELLO!",
  "MY NAME IS DORIEN.",
  "",
  "I MADE A WEBSITE ABOUT",
  "WHATS IN MY BAG.",
  "WANNE SEE?",
  "",
  "#CHOICE#"            // YES / NO
];
const TYPE_MS = 45, LINE_PAUSE = 220, GAP_PAUSE = 380;
const intro = document.getElementById('intro');
const e1 = document.getElementById('e1');
let typeTimer = null, chars = [], noBtn = null, noHome = null;

function spans(text, parent){
  for(const c of text){
    const s = document.createElement('span');
    s.className = 'ch'; s.textContent = c;
    parent.appendChild(s); chars.push(s);
  }
}
function buildIntro(){
  intro.innerHTML = ''; chars = [];
  INTRO.forEach(line=>{
    const ln = document.createElement('span');
    ln.className = 'ln';
    if(line === '') { ln.classList.add('gap'); chars.push('GAP'); }
    else if(line === '#CHOICE#'){
      ln.classList.add('choice');
      const yes = document.createElement('button');
      yes.className = 'yes'; yes.setAttribute('aria-label','Yes');
      spans('YES', yes);
      const mid = document.createElement('span'); mid.className = 'slash';
      spans(' / ', mid);
      noHome = document.createElement('span'); noHome.className = 'no-home';
      noBtn = document.createElement('button');
      noBtn.className = 'no'; noBtn.setAttribute('aria-label','No'); noBtn.tabIndex = -1;
      spans('NO', noBtn);
      noHome.appendChild(noBtn);
      ln.append(yes, mid, noHome);
      yes.addEventListener('click', e=> confetti(e));   // YES → confetti, dan naar HOME
      noBtn.addEventListener('click', e=>{ e.preventDefault(); flee(); });
    }
    else spans(line, ln);
    intro.appendChild(ln);
    chars.push('BR');
  });
}

function fitIntro(){
  const cs = getComputedStyle(e1);
  const availW = e1.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
  const availH = e1.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4;
  let lo = 8, hi = Math.min(innerHeight * 0.095, innerWidth * 0.12);
  for(let k=0;k<18;k++){
    const mid = (lo+hi)/2;
    intro.style.setProperty('--ifs', mid + 'px');
    (intro.scrollWidth <= availW && intro.scrollHeight <= availH) ? lo = mid : hi = mid;
  }
  intro.style.setProperty('--ifs', lo + 'px');
}

function stopIntro(){ clearTimeout(typeTimer); typeTimer = null; }
function startIntro(){
  stopIntro();
  buildIntro();
  intro.classList.add('typing');
  fitIntro();
  const caret = document.createElement('span'); caret.className = 'caret';
  let i = 0;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function step(){
    if(i >= chars.length){ caret.remove(); intro.classList.remove('typing'); typeTimer = null; return; }
    const c = chars[i++];
    if(typeof c === 'string'){ typeTimer = setTimeout(step, reduced ? 0 : (c === 'GAP' ? GAP_PAUSE : LINE_PAUSE)); return; }
    c.classList.add('v');
    c.after(caret);
    typeTimer = setTimeout(step, reduced ? 0 : (c.textContent === ' ' ? TYPE_MS * 0.6 : TYPE_MS + Math.random() * 35));
  }
  typeTimer = setTimeout(step, 350);
}

/* ---- YES: blauwe confetti over het hele scherm, daarna naar HOME ---- */
let confettiBusy = false;
function confetti(e){
  if(confettiBusy) return;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){ goTo(0); return; }
  confettiBusy = true;
  const yesBtn = e.currentTarget.getBoundingClientRect();
  const ox = e.clientX || yesBtn.left + yesBtn.width/2, oy = e.clientY || yesBtn.top + yesBtn.height/2;
  const layer = document.createElement('div'); layer.className = 'confetti';
  document.body.appendChild(layer);
  const W = innerWidth, H = innerHeight;
  const d = Math.max(26, Math.min(64, W * 0.034));
  const N = Math.round(Math.max(26, Math.min(48, W * H / 42000)));
  const dots = [];
  for(let k = 0; k < N; k++){
    // spread over the whole screen, a few a little over the edges
    let x, y, tries = 0;
    do { x = -d*0.3 + Math.random() * (W + d*0.6); y = -d*0.3 + Math.random() * (H + d*0.6); tries++; }
    while(tries < 30 && dots.some(p => Math.hypot(p.x - x, p.y - y) < d * 1.15));
    dots.push({ x, y });
    const el = document.createElement('i'); el.style.setProperty('--d', d + 'px');
    layer.appendChild(el);
    const midX = ox + (x - ox) * 0.55, midY = Math.min(oy, y) - H * (0.08 + Math.random() * 0.12);
    const dur = 650 + Math.random() * 450, delay = Math.random() * 120;
    el.animate([
      { transform:`translate(${ox}px,${oy}px) scale(.2)`, opacity:0 },
      { transform:`translate(${midX}px,${midY}px) scale(1.05)`, opacity:1, offset:.45 },
      { transform:`translate(${x}px,${y}px) scale(1)`, opacity:1 }
    ], { duration: dur, delay, easing:'cubic-bezier(.2,.7,.3,1)', fill:'forwards' });
    // after the slide to HOME: the dots drop away
    el.animate([{ opacity:1, transform:`translate(${x}px,${y}px) scale(1)` },
                { opacity:0, transform:`translate(${x}px,${y + H*0.25}px) scale(.6)` }],
               { duration: 700, delay: 2300 + Math.random() * 400, easing:'cubic-bezier(.5,0,.9,.6)', fill:'forwards' });
  }
  setTimeout(()=> goTo(0), 1250);
  setTimeout(()=>{ layer.remove(); confettiBusy = false; }, 3500);
}

/* ---- NO loopt weg ---- */
function flee(px, py){
  if(intro.classList.contains('typing')) return;
  const area = e1.getBoundingClientRect();
  const r = noBtn.getBoundingClientRect();
  if(!noBtn.classList.contains('loose')){
    // keep its place in the line, then lift it out
    noHome.style.display = 'inline-block';
    noHome.style.width = r.width + 'px'; noHome.style.height = r.height + 'px';
    noBtn.classList.add('loose');
    noBtn.style.left = (r.left - area.left) + 'px';
    noBtn.style.top  = (r.top  - area.top)  + 'px';
    noBtn.getBoundingClientRect(); // commit start position
  }
  if(px === undefined){ px = r.left + r.width/2; py = r.top + r.height/2; }
  const maxX = area.width - r.width - 6, maxY = area.height - r.height - 6;
  // rectangles of the typed text, so NO doesn't land on top of the words
  const textRects = [];
  intro.querySelectorAll('.ln').forEach(ln=>{
    const rg = document.createRange(); rg.selectNodeContents(ln);
    for(const q of rg.getClientRects()) if(q.width > 2) textRects.push(q);
  });
  const hits = (x,y)=> textRects.some(q=> area.left+x < q.right+8 && area.left+x+r.width > q.left-8 && area.top+y < q.bottom && area.top+y+r.height > q.top);
  let best = null, bestD = -1;
  for(let k=0;k<80;k++){
    const x = 6 + Math.random()*Math.max(0,maxX-6), y = 6 + Math.random()*Math.max(0,maxY-6);
    if(k < 70 && hits(x,y)) continue;
    const d = Math.hypot(area.left + x + r.width/2 - px, area.top + y + r.height/2 - py);
    if(d > bestD){ bestD = d; best = [x,y]; }
    if(d > Math.min(area.width, area.height) * 0.45) break;
  }
  if(!best) best = [6, 6];
  noBtn.style.left = best[0] + 'px';
  noBtn.style.top  = best[1] + 'px';
}
e1.addEventListener('pointermove', e=>{
  if(!noBtn || edition !== 1) return;
  const r = noBtn.getBoundingClientRect();
  const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
  const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
  if(Math.hypot(dx, dy) < Math.max(40, r.height * 0.6)) flee(e.clientX, e.clientY);
});
e1.addEventListener('pointerdown', e=>{
  if(noBtn && (e.target === noBtn || noBtn.contains(e.target))){ e.preventDefault(); flee(e.clientX, e.clientY); }
});
e1.addEventListener('touchstart', e=>{
  if(noBtn && noBtn.contains(e.target)){ e.preventDefault(); const t=e.touches[0]; flee(t.clientX, t.clientY); }
}, { passive:false });

const BAG = [

  { from: 12, items: ["CHARGER","TOILETRY BAG","COMPUTER","HEADPHONES","LUNCH",

  { from: 22, items: ["WALLET","KEYS","LIPGLOSS","POWERBANK","JACKET"] },               // uitgaan, kleine tas
];
const DARK_FROM = 20, LIGHT_FROM = 8;   // donker 20:00–08:00, licht 08:00–20:00
const LAST_MINUTE = 23 * 60 + 59;

const e5 = document.getElementById('e5');
const listEl = document.getElementById('list');
const minuteHand = document.getElementById('minute');
const hourHand = document.getElementById('hour');
let shownBlock = -1, lastMinutes = -1, target = 0, current = 0, raf = 0;

function blockFor(hour){ let idx = 0; BAG.forEach((b,i)=>{ if(hour >= b.from) idx = i; }); return idx; }

function renderList(idx, measuring){
  const items = BAG[idx].items;
  listEl.innerHTML = '';
  items.forEach((name,i)=>{
    const li = document.createElement('li');
    if(measuring) li.style.animation = 'none'; else li.style.animationDelay = (i*35)+'ms';
    li.textContent = name;
    if(!(i === items.length - 1 && items.length > 6)){

      li.append(' ', s);
    }

  });
}

/* biggest font size at which every hour's list fits inside the frame */
function fitList(){
  if(edition !== 5) return;
  const cs = getComputedStyle(e5);
  const availH = e5.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4;
  const availW = e5.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
  const cap = innerWidth <= innerHeight ? innerWidth * 0.075 : Math.min(innerHeight * 0.062, innerWidth * 0.034);
  let lo = 8, hi = Math.max(8, cap);
  for(let k=0;k<18;k++){
    const mid = (lo+hi)/2;
    listEl.style.setProperty('--fs', mid + 'px');
    let ok = true;
    for(let i=0;i<BAG.length && ok;i++){
      renderList(i, true);
      if(listEl.offsetHeight > availH || listEl.offsetWidth > availW) ok = false;
    }
    ok ? lo = mid : hi = mid;
  }
  listEl.style.setProperty('--fs', lo + 'px');
  renderList(shownBlock < 0 ? 0 : shownBlock);
}

function draw(total, force){
  total = Math.round(total);
  if(total === lastMinutes && !force) return;
  lastMinutes = total;
  const h = Math.floor(total / 60), m = total % 60;
  minuteHand.setAttribute('transform', `rotate(${m * 6})`);
  hourHand.setAttribute('transform', `rotate(${(h % 12) * 30 + m * 0.5})`);
  if(edition !== 5) return;
  infoEl.textContent = pad2(h) + ':' + pad2(m);
  document.body.classList.toggle('dark', h >= DARK_FROM || h < LIGHT_FROM);
  const idx = blockFor(h);
  if(idx !== shownBlock){ shownBlock = idx; renderList(idx); }
  hint.classList.toggle('gone', total > 20);
}
function enterClock(){ fitList(); shownBlock = -1; draw(current, true); }

function tick(){
  current += (target - current) * 0.25;
  if(Math.abs(target - current) < 0.5) current = target;
  draw(current);
  raf = current === target ? 0 : requestAnimationFrame(tick);
}
function setTarget(v){ target = Math.min(LAST_MINUTE, Math.max(0, v)); if(!raf) raf = requestAnimationFrame(tick); }

/* scroll / swipe / keys turn the clock — only in editie 05 */
const MIN_PER_PX = 0.25;   // ±25 minuten per tik van het muiswieltje
addEventListener('wheel', e=>{
  e.preventDefault();
  if(edition !== 5) return;
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
  setTarget(target + (e.deltaY || e.deltaX) * unit * MIN_PER_PX);

addEventListener('touchmove', e=>{
  if(edition !== 5 || touchY === null) return;
  const y = e.touches[0].clientY;

}, { passive:false });
addEventListener('touchend', ()=>{ touchY = null; });
addEventListener('keydown', e=>{
  if(edition !== 5) return;
  const step = { ArrowDown:5, ArrowUp:-5, PageDown:60, PageUp:-60, ' ':60 }[e.key];
  if(e.key === 'Home'){ e.preventDefault(); setTarget(0); }
  else if(e.key === 'End'){ e.preventDefault(); setTarget(LAST_MINUTE); }
  else if(step){ e.preventDefault(); setTarget(target + step); }
});

addEventListener('resize', ()=>{ if(edition === 1){ fitIntro(); } fitList(); fitIndex(); });

/* =====================================================================
   EDITIE 04 — DE HANDELING
   Typ een item: het verschijnt bij je cursor. ENTER → bij het eerste woord
   gaat de tas open, en elk woord valt in de OPENING van de tas.
   CLEAN MY PURSE → alles eruit en de tas gaat weer dicht.
   ===================================================================== */
const OPENING = [[793, 822], [900, 810], [975, 785], [1020, 760], [1060, 748], [1305, 738], [1337, 737], [1420, 758], [1486, 772], [1508, 770], [1492, 815], [1472, 870], [1463, 910], [1470, 935], [1453, 955], [1420, 1000], [1402, 1080], [1402, 1160], [1405, 1220], [1395, 1265], [1362, 1308], [1325, 1332], [1275, 1320], [1150, 1312], [1080, 1285], [1000, 1215], [900, 1105], [830, 1032], [775, 991], [765, 985], [778, 958], [805, 930], [813, 905], [800, 860], [785, 828], [775, 793]];                  // de opening van de open tas (tekening-coördinaten)
function inOpening(x, y){
  let inside = false;
  for(let i = 0, j = OPENING.length - 1; i < OPENING.length; j = i++){
    const [xi, yi] = OPENING[i], [xj, yj] = OPENING[j];
    if(((yi > y) !== (yj > y)) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const e4 = document.getElementById('e4');
const bagStage = document.getElementById('bagstage');
const bagSvg = document.getElementById('bagsvg');
const inBagG = document.getElementById('inBag');
const flyingG = document.getElementById('flying');
const typingNow = document.getElementById('typingNow');
const typeInput = document.getElementById('typeInput');
const emptyBtn = document.getElementById('emptyBtn');
const SVGNS = 'http://www.w3.org/2000/svg';
const placed = [];
let pointer = null, measureEl = null;

function enterBag(on){
  emptyBtn.hidden = !on;
  if(on){
    if(!pointer){ const r = e4.getBoundingClientRect(); pointer = { x: r.width * 0.5, y: r.height * 0.9 }; }

function renderTyping(){
  const txt = typeInput.value.toUpperCase();
  typingNow.innerHTML = '';
  if(txt) typingNow.append(txt);
  else { const ph = document.createElement('span'); ph.className = 'ph'; ph.textContent = 'TYPE AN ITEM + ENTER'; typingNow.append(ph); }

function placeTyping(){
  typingNow.style.left = pointer.x + 'px';
  typingNow.style.top = pointer.y + 'px';

  typingNow.style.transform = pointer.x > e4.clientWidth * 0.7 ? 'translate(calc(-100% - 12px),-50%)' : 'translate(12px,-50%)';
}
e4.addEventListener('pointermove', e=>{

  pointer = { x: e.clientX - r.left, y: e.clientY - r.top };

});
e4.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const r = e4.getBoundingClientRect();
  pointer = { x: e.clientX - r.left, y: e.clientY - r.top };

});
typeInput.addEventListener('input', ()=>{ typeInput.value = typeInput.value.replace(/\n/g,'').slice(0, 28); renderTyping(); });
typeInput.addEventListener('keydown', e=>{

addEventListener('keydown', e=>{

  if(e.key.length === 1 || e.key === 'Backspace' || e.key === 'Enter') typeInput.focus({ preventScroll:true });
}, true);

function textWidth(text, fs){
  if(!measureEl){ measureEl = document.createElementNS(SVGNS, 'text'); measureEl.setAttribute('class','wtxt'); measureEl.style.visibility = 'hidden'; flyingG.appendChild(measureEl); }
  measureEl.style.fontSize = fs + 'px';
  measureEl.textContent = text;
  return measureEl.getComputedTextLength();
}
function boxPts(cx, cy, w, h, a, pad){
  const cos = Math.cos(a), sin = Math.sin(a), pts = [], nx = Math.max(6, Math.ceil(w / 60)), ny = 3;
  for(let i=0;i<=nx;i++) for(let j=0;j<=ny;j++){
    const lx = (i/nx - .5) * (w + pad*2), ly = (j/ny - .5) * (h + pad*2);
    pts.push([cx + lx*cos - ly*sin, cy + lx*sin + ly*cos]);
  }
  return pts;
}
function inBox(px, py, b){
  const dx = px - b.cx, dy = py - b.cy, c = Math.cos(-b.a), s = Math.sin(-b.a);
  return Math.abs(dx*c - dy*s) < b.w/2 && Math.abs(dx*s + dy*c) < b.h/2;
}
const OX = OPENING.map(p=>p[0]), OY = OPENING.map(p=>p[1]);
const OMIN = [Math.min(...OX), Math.min(...OY)], OMAX = [Math.max(...OX), Math.max(...OY)];
function findSpot(text){
  for(let fs = 115; fs >= 26; fs *= 0.88){
    const w = textWidth(text, fs), h = fs * 0.74;
    let best = null, bestHits = Infinity;
    for(let k=0;k<600;k++){
      const a = (Math.random() * 110 - 55) * Math.PI / 180;
      const cx = OMIN[0] + Math.random() * (OMAX[0] - OMIN[0]);
      const cy = OMIN[1] + Math.random() * (OMAX[1] - OMIN[1]);
      const pts = boxPts(cx, cy, w, h, a, 10);
      if(!pts.every(p => inOpening(p[0], p[1]))) continue;
      let hits = 0;
      for(const b of placed) for(const p of pts) if(inBox(p[0], p[1], b)) hits++;
      if(hits < bestHits){ bestHits = hits; best = { cx, cy, w, h, a, fs }; if(!hits) break; }
    }
    if(best && (bestHits === 0 || fs < 45)) return best;
  }
  return null;
}
function screenToSvg(x, y){
  const pt = bagSvg.createSVGPoint(); pt.x = x; pt.y = y;
  return pt.matrixTransform(bagSvg.getScreenCTM().inverse());
}

let opened = false;
function commitWord(){
  const text = typeInput.value.trim().toUpperCase().replace(/\s+/g,' ');
  if(!text) return;
  typeInput.value = ''; renderTyping();
  const spot = findSpot(text);
  if(!spot){ typingNow.animate([{transform:'translate(12px,-50%)'},{transform:'translate(26px,-50%)'},{transform:'translate(12px,-50%)'}],{duration:260}); return; }
  placed.push(spot);
  const firstOpen = !opened;
  if(!opened){ opened = true; bagStage.classList.add('isopen'); }

  const er = e4.getBoundingClientRect();
  const from = screenToSvg(er.left + pointer.x, er.top + pointer.y);
  const scale0 = (parseFloat(getComputedStyle(typingNow).fontSize) / bagSvg.getScreenCTM().a) / spot.fs;
  const deg = spot.a * 180 / Math.PI;
  const lift = 150 + spot.h;                                // drop in from above the opening
  const el = document.createElementNS(SVGNS, 'text');
  el.setAttribute('class','wtxt'); el.style.fontSize = spot.fs + 'px'; el.textContent = text;
  el.style.strokeWidth = Math.max(1.1, spot.fs * 0.019) + 'px';   // thin outline, like the design
  const w0 = textWidth(text, spot.fs) * scale0 * (pointer.x > e4.clientWidth * 0.7 ? -1 : 1);
  const T = (x, y, r, s) => `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
  el.style.transform = T(from.x + w0/2 + 12, from.y, 0, scale0);
  flyingG.appendChild(el);
  // 1) fly from your cursor to just above its spot
  const fly = el.animate([
    { transform: T(from.x + w0/2 + 12, from.y, 0, scale0) },
    { transform: T(spot.cx, spot.cy - lift, deg * .6, 1) }
  ], { duration: 520, delay: firstOpen ? 380 : 0, easing:'cubic-bezier(.3,.7,.4,1)', fill:'forwards' });
  fly.onfinish = ()=>{
    // 2) slide down INTO the bag (clipped by the opening, so it disappears behind the edge)
    inBagG.appendChild(el);
    fly.cancel();
    el.style.transform = T(spot.cx, spot.cy, deg, 1);
    el.animate([{ transform: T(spot.cx, spot.cy - lift, deg * .6, 1) }, { transform: T(spot.cx, spot.cy + 8, deg, 1), offset:.8 }, { transform: T(spot.cx, spot.cy, deg, 1) }],
               { duration: 560, easing:'cubic-bezier(.5,0,.6,1)' });
  };
}

emptyBtn.addEventListener('click', ()=>{

  const els = [...inBagG.children];
  els.forEach((el, i)=>{

    el.animate([{ transform:t, opacity:1 }, { transform: t.replace(/translate\(([^,]+),([^)]+)\)/, (m,x,y)=>`translate(${x},${parseFloat(y)+500}px)`), opacity:0 }],
               { duration:650, delay:i*45, easing:'cubic-bezier(.5,0,.9,.5)', fill:'forwards' }).onfinish = ()=> el.remove();
  });

  typeInput.focus({ preventScroll:true });
});

/* =====================================================================
   EDITIE 02 — SHAKE THAT BAG!!!
   Pak de tas vast (muis of vinger) en schud: bij elke schudbeweging
   vallen er spullen uit. Op een gsm mag je ook gewoon je telefoon schudden.
   ===================================================================== */
const shk = document.getElementById('shk');
const sbag = document.getElementById('sbag');
const shakeHint = document.getElementById('shakeHint');
const shakeReset = document.getElementById('shakeReset');
const loot = [...shk.querySelectorAll('.loot')];
const START = { left: sbag.style.left, top: sbag.style.top, width: sbag.style.width };
const END = Object.fromEntries(sbag.dataset.end.split(';').map(p => p.split(':')));
let inBagLeft = [], drag = null, flying = 0;

function resetShake(animated){
  inBagLeft = loot.slice().sort(()=> Math.random() - .5);
  if(animated){
    const m = mouth();
    loot.forEach((el, i)=>{
      if(!el.classList.contains('out')) return;
      const r = el.getBoundingClientRect();
      const dx = m.x - (r.left + r.width/2), dy = m.y - (r.top + r.height/2);
      el._spot = null;
      el.animate([{ transform:`translate(0px,0px) ${el.style.transform}`, opacity:1 },
                  { transform:`translate(${dx}px,${dy}px) scale(.25)`, opacity:0 }],
                 { duration:520, delay:i*35, easing:'cubic-bezier(.6,0,.8,.4)', fill:'none' })
        .onfinish = ()=> el.classList.remove('out');
    });
  } else loot.forEach(el => el.classList.remove('out'));
  sbag.classList.add('home');
  Object.assign(sbag.style, START, { transform:'' });
  updateShakeUI();
}
function updateShakeUI(){
  const on = edition === 2;
  const anyOut = inBagLeft.length < loot.length;
  shakeHint.hidden = !on || anyOut;
  shakeReset.hidden = !on || !anyOut;
  sbag.classList.toggle('idle', on && !anyOut && !drag);
}
function enterShake(on){ updateShakeUI(); }

function mouth(){                         // the opening of the bag, in screen px
  const r = sbag.getBoundingClientRect();
  return { x: r.left + r.width * .5, y: r.top + r.height * .18 };
}

/* pick a new, random landing spot each time: inside the page, as little overlap as possible */
const BAG_END = { x: 420/2410*100, y: 915/1512*100, w: 860/2410*100, h: 540/1512*100 };
function overlap(a, b){
  const w = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
  const h = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
  return w > 0 && h > 0 ? w * h : 0;
}
function randomSpot(el){
  const sr = shk.getBoundingClientRect();
  const w = parseFloat(el.style.width);                                   // % of stage width
  const h = w * (el.naturalHeight / el.naturalWidth || .8) * sr.width / sr.height;   // % of stage height
  const others = loot.filter(o => o !== el && o.classList.contains('out')).map(o => o._spot).filter(Boolean);
  let best = null, bestScore = Infinity;
  for(let k = 0; k < 120; k++){
    const spot = { x: 1 + Math.random() * (98 - w), y: 1 + Math.random() * (98 - h), w, h };
    let score = overlap(spot, BAG_END) * 0.6;
    for(const o of others) score += overlap(spot, o);
    if(score < bestScore){ bestScore = score; best = spot; if(score === 0) break; }
  }
  return best;
}

function dropOne(power = 1){
  if(!inBagLeft.length) return;
  const el = inBagLeft.pop();
  // new place + new angle every time
  const spot = randomSpot(el);
  el._spot = spot;
  el.style.left = spot.x + '%';
  el.style.top = spot.y + '%';
  const flip = el.dataset.k === 'earbuds2' ? -1 : 1;
  const rot = (Math.random() * 50 - 25).toFixed(1);
  const finalT = `rotate(${rot}deg) scaleX(${flip})`;
  el.style.transform = finalT;
  el.classList.add('out');
  const m = mouth(), r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const dx = m.x - cx, dy = m.y - cy;
  const sr = shk.getBoundingClientRect();
  const apexX = dx * .55 + (Math.random() - .5) * sr.width * .12;
  const apexY = Math.min(dy, 0) * .4 - sr.height * (.18 + .12 * Math.random() * power);
  const spin = (Math.random() < .5 ? -1 : 1) * (180 + Math.random() * 360);
  flying++;
  el.animate([
    { transform:`translate(${dx}px,${dy}px) rotate(${spin}deg) scale(.3)`, opacity:0, offset:0 },
    { transform:`translate(${apexX}px,${apexY}px) rotate(${spin * .35}deg) scale(.85)`, opacity:1, offset:.38 },
    { transform:`translate(0px,0px) ${finalT}`, opacity:1, offset:1 }
  ], { duration: 950 + Math.random() * 350, easing:'cubic-bezier(.25,.6,.35,1)' })
    .onfinish = ()=>{ flying--; if(!inBagLeft.length && !drag) settleBag(); };
  updateShakeUI();
}
function settleBag(){
  // everything is out: the bag flops down where it lies in the design
  sbag.classList.add('home');
  Object.assign(sbag.style, END, { transform:'' });
}

/* ---- drag & shake with mouse or finger ---- */
sbag.addEventListener('pointerdown', e=>{
  e.preventDefault();
  sbag.setPointerCapture(e.pointerId);
  sbag.classList.remove('home','idle');
  sbag.classList.add('held');
  const r = sbag.getBoundingClientRect();
  drag = { ox: e.clientX, oy: e.clientY, last: { x: e.clientX, y: e.clientY, t: performance.now() },
           dirX: 0, dirY: 0, energy: 0, tx: 0, ty: 0 };
  askMotion();
  updateShakeUI();
});
sbag.addEventListener('pointermove', e=>{
  if(!drag) return;
  const now = performance.now(), dt = Math.max(1, now - drag.last.t);
  const vx = (e.clientX - drag.last.x) / dt, vy = (e.clientY - drag.last.y) / dt;
  drag.tx = e.clientX - drag.ox; drag.ty = e.clientY - drag.oy;
  sbag.style.transform = `translate(${drag.tx}px,${drag.ty}px) rotate(${Math.max(-25, Math.min(25, vx * 14))}deg)`;
  // a "shake" = fast change of direction
  const sx = Math.abs(vx) > .45 ? Math.sign(vx) : 0, sy = Math.abs(vy) > .45 ? Math.sign(vy) : 0;
  if(sx && drag.dirX && sx !== drag.dirX) drag.energy += Math.abs(vx);
  if(sy && drag.dirY && sy !== drag.dirY) drag.energy += Math.abs(vy);
  if(sx) drag.dirX = sx; if(sy) drag.dirY = sy;
  while(drag.energy > 1.3){ drag.energy -= 1.3; dropOne(Math.min(2, Math.hypot(vx, vy))); }
  drag.last = { x: e.clientX, y: e.clientY, t: now };
});
function release(){
  if(!drag) return;
  drag = null;
  sbag.classList.remove('held');
  sbag.classList.add('home');
  if(!inBagLeft.length && !flying) settleBag();
  else if(inBagLeft.length) sbag.style.transform = '';
  else sbag.style.transform = '';
  updateShakeUI();
}
sbag.addEventListener('pointerup', release);
sbag.addEventListener('pointercancel', release);
shakeReset.addEventListener('click', ()=> resetShake(true));

/* ---- shake the phone itself ---- */
let motionAsked = false, lastShake = 0;
function askMotion(){
  if(motionAsked) return; motionAsked = true;
  try{
    if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function')
      DeviceMotionEvent.requestPermission().catch(()=>{});
  }catch(_){}
}
addEventListener('devicemotion', e=>{
  if(edition !== 2) return;
  const a = e.acceleration || e.accelerationIncludingGravity; if(!a) return;
  const mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0) - (e.acceleration ? 0 : 9.8);
  const now = performance.now();
  if(mag > 14 && now - lastShake > 160){
    lastShake = now;
    sbag.animate([{transform:'rotate(-6deg)'},{transform:'rotate(6deg)'},{transform:'rotate(0)'}],{duration:220});
    dropOne(1.5);
    if(!inBagLeft.length) setTimeout(()=>{ if(!flying) settleBag(); }, 1400);
  }
});
document.addEventListener('click', ()=>{ if(edition === 2) askMotion(); }, { once:false });

resetShake(false);

fromHash();
</script>
</body>
