<script>
(function(){
  var page=document.getElementById('page'), cv=document.getElementById('tekening'),
      ctx=cv.getContext('2d'), pen=document.getElementById('potlood');
  // terug naar de juiste tas op pagina 2
  var home=document.getElementById('home');
  try{ if(document.referrer.indexOf('black')>-1) home.href='page2.html#black';
        else if(document.referrer.indexOf('blue')>-1) home.href='page2.html#blue'; }catch(e){}

  var TIP={x:6/531, y:321/336};          // punt van het potlood (t.o.v. potlood), 0..1
  var PH=336/531;                                   // hoogte/breedte van het potlood
  var pos={x:0.787544, y:0.047071};          // linkerbovenhoek potlood, in delen van de pagina
  var strokes=[], cur=null, drag=null;

  function size(){
    var r=page.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
    redraw();
  }
  function lineW(){ return Math.max(1, cv.width*0.0009); }
  function style(){ ctx.strokeStyle='#111'; ctx.lineWidth=lineW(); ctx.lineCap='round'; ctx.lineJoin='round'; }
  function redraw(){
    ctx.clearRect(0,0,cv.width,cv.height); style();
    strokes.forEach(function(s){
      ctx.beginPath();
      s.forEach(function(p,i){ var x=p.x*cv.width,y=p.y*cv.height; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      if(s.length===1) ctx.lineTo(s[0].x*cv.width+0.01,s[0].y*cv.height);
      ctx.stroke();
    });
  }
  function place(){ pen.style.left=(pos.x*100)+'%'; pen.style.top=(pos.y*100)+'%'; }
  function tipPoint(){
    var r=page.getBoundingClientRect(), pw=pen.getBoundingClientRect().width/r.width;   // breedte potlood / pagina
    var ph=pw*PH*r.width/r.height;                                                       // hoogte potlood / pagina
    return {x:pos.x+TIP.x*pw, y:pos.y+TIP.y*ph, pw:pw, ph:ph};
  }

  pen.addEventListener('pointerdown',function(e){
    e.preventDefault(); pen.setPointerCapture(e.pointerId); pen.classList.add('pakt');
    var r=page.getBoundingClientRect();
    drag={dx:(e.clientX-r.left)/r.width-pos.x, dy:(e.clientY-r.top)/r.height-pos.y};
    cur=null;
  });
  pen.addEventListener('pointermove',function(e){
    if(!drag) return;
    var r=page.getBoundingClientRect(), t0=tipPoint();
    var nx=(e.clientX-r.left)/r.width-drag.dx, ny=(e.clientY-r.top)/r.height-drag.dy;
    // punt moet binnen de pagina blijven
    var tx=nx+(t0.x-pos.x), ty=ny+(t0.y-pos.y);
    if(tx<0) nx-=tx; if(tx>1) nx-=(tx-1); if(ty<0) ny-=ty; if(ty>1) ny-=(ty-1);
    pos.x=nx; pos.y=ny; place();
    var t=tipPoint(), p={x:t.x,y:t.y};
    if(!cur){ cur=[p]; strokes.push(cur); return; }
    var last=cur[cur.length-1];
    style(); ctx.beginPath(); ctx.moveTo(last.x*cv.width,last.y*cv.height); ctx.lineTo(p.x*cv.width,p.y*cv.height); ctx.stroke();
    cur.push(p);
  });
  function stop(e){ if(!drag) return; drag=null; cur=null; pen.classList.remove('pakt'); }
  pen.addEventListener('pointerup',stop); pen.addEventListener('pointercancel',stop);
  pen.addEventListener('dragstart',function(e){e.preventDefault()});
  window.addEventListener('resize',size);
  size(); place();
})();
</script>
