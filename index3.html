<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello!</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* Eigen lettertype? Zet het bestand in je repo en haal dit uit commentaar:
  @font-face { font-family: "MijnPixel"; src: url("pixel.woff2") format("woff2"); }
  Pas daarna --font-pixel hieronder aan. */
  :root {
    --font-pixel: "DotGothic16", monospace;
    --blauw: #1c05f5;
    --u: 0.9vw;          /* schaal: 1vw = precies als op je foto, 0.9vw = een klein beetje kleiner */
  }
  @media (max-width: 700px) { :root { --u: 1.15vw; } }

  html, body { margin: 0; min-height: 100%; background: #fff; }
  body { overflow-x: hidden; }

  .pagina {
    padding: calc(5.6 * var(--u)) 0 0 calc(1.89 * var(--u));
  }

  /* ---------- letters / blokjes ---------- */
  .regel { display: flex; width: fit-content; height: calc(4.37 * var(--u)); }

  .letter {
    position: relative;
    box-sizing: border-box;
    width: calc(2.353 * var(--u));
    height: calc(4.37 * var(--u));
    background: var(--blauw);
    color: #fff;
    font-family: var(--font-pixel);
    font-size: calc(3.88 * var(--u));
    line-height: calc(4.37 * var(--u));
    text-align: center;
    visibility: hidden;                 /* verschijnt pas als hij "getypt" wordt */
  }
  .letter.zichtbaar { visibility: visible; }

  /* knipperende typ-cursor op de plek van de volgende letter */
  .letter.cursor::before {
    content: "";
    position: absolute;
    left: calc(0.15 * var(--u));
    top: 14%;
    width: calc(0.3 * var(--u));
    height: 72%;
    background: var(--blauw);
    visibility: visible;
    animation: knipper 0.9s steps(1) infinite;
  }
  @keyframes knipper { 50% { opacity: 0; } }

  /* ---------- knoppen ---------- */
  .rij {
    display: flex;
    align-items: flex-start;
    gap: calc(6.26 * var(--u));
    margin-top: calc(8.74 * var(--u));
  }
  .knop {
    display: flex;
    height: calc(4.37 * var(--u));
    margin: 0; padding: 0; border: 0;
    background: none;
    font: inherit;
    text-decoration: none;
    cursor: pointer;
  }
  #nee { pointer-events: none; }
  #nee.klaar { pointer-events: auto; }
  #scheid { cursor: default; }
</style>
</head>
<body>
  <main class="pagina">
    <div id="tekst"></div>
    <div class="rij">
      <a class="knop" id="ja" href="#"></a>
      <span class="knop" id="scheid"></span>
      <button class="knop" id="nee" type="button" aria-label="NO"></button>
    </div>
  </main>

<script>
  // ====== INSTELLINGEN ======
  const regels = [
    "Hello!",
    "My name is Dorien",
    "I made a website about what’s in ",
    "my bag.",
    "Wanna see?"
  ];
  const jaTekst   = "YES!!!!!!";     // zoals op je foto: pas aan naar wens
  const jaLink    = "#";             // <-- zet hier de link waar YES naartoe moet
  const typMin    = 25;              // ms: snelste tijd tussen twee letters
  const typMax    = 70;              // ms: langzaamste tijd
  const pauzeRegel   = 450;          // ms pauze na elke regel
  const pauzeKnoppen = 700;          // ms pauze voor de knoppen verschijnen
  const startVertraging = 600;       // ms voor de eerste letter
  const vluchtAfstand   = 60;        // px: zo dichtbij mag je muis komen voor NO wegspringt
  // ===========================

  const wacht = ms => new Promise(r => setTimeout(r, ms));
  const willekeurig = (a, b) => a + Math.random() * (b - a);

  function vulMet(container, tekst) {
    return [...tekst].map(teken => {
      const s = document.createElement("span");
      s.className = "letter";
      s.textContent = teken === " " ? "\u00A0" : teken;
      container.appendChild(s);
      return s;
    });
  }

  // ---------- alles opbouwen (nog onzichtbaar) ----------
  const groepen = [];   // { cellen, pauzeNa, tekst }
  const tekstEl = document.getElementById("tekst");
  regels.forEach((t, i) => {
    const regel = document.createElement("div");
    regel.className = "regel";
    tekstEl.appendChild(regel);
    groepen.push({
      cellen: vulMet(regel, t), tekst: t,
      pauzeNa: i === regels.length - 1 ? pauzeKnoppen : pauzeRegel
    });
  });

  const ja = document.getElementById("ja");
  const scheid = document.getElementById("scheid");
  const nee = document.getElementById("nee");
  ja.href = jaLink;
  groepen.push({ cellen: vulMet(ja, jaTekst),   tekst: jaTekst,   pauzeNa: 250 });
  groepen.push({ cellen: vulMet(scheid, "/"),   tekst: "/",       pauzeNa: 250 });
  groepen.push({ cellen: vulMet(nee, "NO :("),  tekst: "NO :(",   pauzeNa: 0, laatste: true });

  // ---------- typen ----------
  async function start() {
    const rij = groepen.flatMap(g => g.cellen.map((cel, i) => ({
      cel, teken: g.tekst[i],
      eindeGroep: i === g.cellen.length - 1, g
    })));

    rij[0].cel.classList.add("cursor");
    await wacht(startVertraging);

    for (let i = 0; i < rij.length; i++) {
      const { cel, teken, eindeGroep, g } = rij[i];
      cel.classList.remove("cursor");
      cel.classList.add("zichtbaar");
      if (rij[i + 1]) rij[i + 1].cel.classList.add("cursor");
      if (eindeGroep && g.laatste) nee.classList.add("klaar");
      await wacht(willekeurig(typMin, typMax) + (teken === " " ? 30 : 0));
      if (eindeGroep) await wacht(g.pauzeNa);
    }
  }
  start();

  // ---------- NO loopt weg ----------
  let gevlucht = false;

  function vlucht(px, py) {
    const r = nee.getBoundingClientRect();
    if (!gevlucht) {                       // eerste keer: losmaken zonder te verspringen
      nee.style.position = "fixed";
      nee.style.left = r.left + "px";
      nee.style.top = r.top + "px";
      nee.style.margin = "0";
      void nee.offsetWidth;
      nee.style.transition = "left .25s ease-out, top .25s ease-out";
      gevlucht = true;
    }
    const m = 12;
    const maxX = Math.max(m, innerWidth - r.width - m);
    const maxY = Math.max(m, innerHeight - r.height - m);
    const minAfstand = Math.min(innerWidth, innerHeight) * 0.35;

    let beste = null, besteAfstand = -1;
    for (let k = 0; k < 40; k++) {
      const x = m + Math.random() * (maxX - m);
      const y = m + Math.random() * (maxY - m);
      const d = Math.hypot(x + r.width / 2 - px, y + r.height / 2 - py);
      if (d > besteAfstand) { besteAfstand = d; beste = { x, y }; }
      if (d >= minAfstand) break;
    }
    nee.style.left = beste.x + "px";
    nee.style.top = beste.y + "px";
  }

  // muis in de buurt, of eroverheen / aanraken
  document.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse" || !nee.classList.contains("klaar")) return;
    const r = nee.getBoundingClientRect();
    if (e.clientX > r.left - vluchtAfstand && e.clientX < r.right + vluchtAfstand &&
        e.clientY > r.top - vluchtAfstand && e.clientY < r.bottom + vluchtAfstand) {
      vlucht(e.clientX, e.clientY);
    }
  });
  nee.addEventListener("pointerenter", e => vlucht(e.clientX, e.clientY));
  nee.addEventListener("pointerdown", e => { e.preventDefault(); vlucht(e.clientX, e.clientY); });
  nee.addEventListener("focus", () => {
    const r = nee.getBoundingClientRect();
    vlucht(r.left + r.width / 2, r.top + r.height / 2);
  });

  // binnen beeld houden als het venster verandert
  addEventListener("resize", () => {
    if (!gevlucht) return;
    const r = nee.getBoundingClientRect();
    nee.style.left = Math.min(Math.max(12, r.left), Math.max(12, innerWidth - r.width - 12)) + "px";
    nee.style.top  = Math.min(Math.max(12, r.top),  Math.max(12, innerHeight - r.height - 12)) + "px";
  });
</script>
</body>
</html>
