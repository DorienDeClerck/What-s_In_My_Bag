<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's in my bag — Dorien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,300;100,400;125,900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0000EE;
    --white:#ffffff;
    --bg:var(--white);
    --fg:var(--blue);
    --pad:2.2vw;
    --bar:3.5vh;
    --line:1.5px;
  }
  body.dark{ --bg:var(--blue); --fg:var(--white); }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);transition:background-color .6s ease;overscroll-behavior:none}
  body{font-family:"Archivo",Helvetica,Arial,sans-serif;color:var(--fg);touch-action:none}

  /* the page itself never scrolls */
  .stage{position:fixed;inset:0;background:var(--bg);transition:background-color .6s ease,color .6s ease}
  .frame{
    position:absolute;inset:var(--pad);
    border:var(--line) solid var(--fg);
    transition:border-color .6s ease;
    display:flex;flex-direction:column;
  }
  .bar{
    height:var(--bar);min-height:34px;flex:none;
    border-bottom:var(--line) solid var(--fg);
    display:flex;justify-content:space-between;align-items:stretch;
    transition:border-color .6s ease;
  }
  .tab{
    display:flex;align-items:center;
    padding:0 1.1vw;
    font-stretch:100%;font-weight:300;
    font-size:clamp(14px,2.1vh,26px);
    letter-spacing:.01em;
    color:var(--fg);text-decoration:none;
    transition:color .6s ease,border-color .6s ease;
  }
  .tab.home{border-right:var(--line) solid var(--fg)}
  .tab.info{border-left:var(--line) solid var(--fg);font-variant-numeric:tabular-nums;min-width:6.5em;justify-content:center}

  .content{flex:1;min-height:0;position:relative;overflow:hidden}

  /* ---------- editions ---------- */
  /* all editions sit side by side on one long sheet; the frame is a window that glides over it */
  .sheet{
    position:absolute;inset:0;
    display:flex;width:calc(100% * var(--count,5));
    transition:transform 1.1s cubic-bezier(.65,0,.35,1);
    will-change:transform;
  }
  .sheet.instant{transition:none}
  .edition{position:relative;flex:0 0 calc(100% / var(--count,5));height:100%;padding:4vh 3.7vw 0 3.8vw;overflow:hidden}

  /* outline type (light) */
  .outline{color:transparent;-webkit-text-stroke:var(--line) var(--fg)}

  /* ========== EDITIE 01 — intro ========== */
  #e1{display:flex;align-items:center}
  .intro{
    font-stretch:100%;font-weight:400;
    font-size:var(--ifs,60px);
    line-height:1.13;
    letter-spacing:-.01em;
    text-transform:uppercase;
    white-space:pre;
    margin-left:-.04em;
    color:transparent;
    -webkit-text-stroke:clamp(.6px,.016em,1.5px) var(--fg);
  }
  .intro .ln{display:block;min-height:1.13em}
  .intro .gap{min-height:1.13em}
  .intro .choice{margin-top:.12em}
  .ch{opacity:0}
  .ch.v{opacity:1}
  .caret{
    display:inline-block;width:.06em;height:.82em;margin-left:.04em;
    background:var(--fg);vertical-align:-.04em;
    animation:blink .9s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  .intro button{
    font:inherit;letter-spacing:inherit;text-transform:inherit;
    background:none;border:0;padding:0;margin:0;
    color:transparent;-webkit-text-stroke:inherit;
    cursor:pointer;
  }
  .intro .yes:hover .ch.v, .intro .yes:focus-visible .ch.v{color:var(--fg)}
  .intro button:focus-visible{outline:2px dashed var(--fg);outline-offset:4px}
  .intro .slash{font-weight:300}
  .no{display:inline-block;transition:left .28s cubic-bezier(.3,1.4,.5,1), top .28s cubic-bezier(.3,1.4,.5,1)}
  .no.loose{position:absolute;z-index:5;white-space:pre}
  .intro.typing button{pointer-events:none}

  /* ========== HOME — overzicht van alle edities ========== */
  #e0{display:flex;align-items:center}
  .index{
    list-style:none;
    font-stretch:100%;font-weight:400;text-transform:uppercase;
    font-size:var(--xfs,60px);line-height:1;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
    margin-left:-.06em;
  }
  .index button{
    font:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left;
    background:none;border:0;padding:0;cursor:pointer;white-space:pre;
    color:transparent;-webkit-text-stroke:clamp(.6px,.012em,1.5px) var(--fg);
    transition:color .2s;
  }
  .index button:hover,.index button:focus-visible{color:var(--fg);outline:none}
  .index .soon-t{opacity:.55}


  /* ========== EDITIE 04 — DE HANDELING: typ items in de tas ========== */
  #e4{display:flex;align-items:center;justify-content:center;cursor:text}
  .bag{
    position:relative;container-type:inline-size;
    width:min(68vw, calc((100vh - var(--bar) - 22vh) * 1.4856));
    aspect-ratio:1915 / 1289;
    margin-top:-2vh;
  }
  .bag svg{position:absolute;inset:0;width:100%;height:100%;display:block;color:var(--fg)}
  .bag .words{position:absolute;inset:0;pointer-events:none}
  .word{
    position:absolute;white-space:pre;
    font-stretch:100%;font-weight:400;text-transform:uppercase;line-height:.85;
    letter-spacing:-.01em;
    color:transparent;-webkit-text-stroke:clamp(.6px,.014em,1.5px) var(--fg);
    transform:translate(-50%,-50%) rotate(var(--r,0deg));
    transition:left .75s cubic-bezier(.2,.9,.3,1.15), top .75s cubic-bezier(.2,.9,.3,1.15),
               transform .75s cubic-bezier(.2,.9,.3,1.15), font-size .75s ease, opacity .5s;
  }
  .word.out{opacity:0;top:120% !important;transition:top .7s cubic-bezier(.5,0,.9,.6), opacity .7s}
  .typing-now{
    position:absolute;z-index:4;pointer-events:none;white-space:pre;
    font-weight:400;text-transform:uppercase;font-size:clamp(18px,4.2vh,48px);line-height:1;
    color:transparent;-webkit-text-stroke:clamp(.6px,.016em,1.5px) var(--fg);
    transform:translate(12px,-50%);
  }
  .typing-now .ph{-webkit-text-stroke:0;color:var(--fg);opacity:.45;font-size:.42em;letter-spacing:.08em;vertical-align:.5em}
  .typing-now .caret{display:inline-block;width:.06em;height:.82em;margin-left:.04em;background:var(--fg);vertical-align:-.04em;animation:blink .9s steps(1) infinite}
  .type-input{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
  .mid{display:grid;align-self:center;justify-items:center}
  .mid > *{grid-area:1 / 1}
  .empty{
    background:none;border:0;cursor:pointer;color:var(--fg);
    font:inherit;font-weight:300;font-size:clamp(11px,1.5vh,16px);letter-spacing:.08em;text-transform:uppercase;
    padding:.4em .6em;text-decoration:underline;text-underline-offset:.25em;text-decoration-thickness:1px;
  }
  .empty[hidden]{display:none}

  /* ========== placeholders ========== */
  .soon{display:flex;align-items:center}
  .soon p{
    font-stretch:100%;font-weight:400;text-transform:uppercase;
    font-size:min(9vh,6vw);line-height:1.13;letter-spacing:-.01em;
  }

  /* ========== EDITIE 05 — the bag clock ========== */
  #e5{display:grid;grid-template:1fr / 1fr}
  #e5 > *{grid-area:1 / 1}
  .list{
    align-self:end;justify-self:start;
    list-style:none;position:relative;z-index:1;
    font-size:var(--fs,40px);
  }
  .list li{
    font-stretch:125%;font-weight:900;
    line-height:1.21;text-transform:uppercase;white-space:nowrap;
    letter-spacing:-.005em;
    opacity:0;transform:translateY(.25em);
    animation:in .35s ease forwards;
  }
  .list li .slash{font-weight:300;font-stretch:100%;margin-left:.15em}
  @keyframes in{to{opacity:1;transform:none}}
  body:not(.dark) .list li{color:transparent;-webkit-text-stroke:var(--line) var(--blue)}
  body.dark .list li{color:var(--white);-webkit-text-stroke:0}

  .clock-wrap{display:flex;justify-content:flex-end;align-items:center;height:100%;min-height:0;position:relative;z-index:2;pointer-events:none}
  .clock{width:min(73.5vh,46vw);height:auto;display:block;overflow:visible}
  .clock .face{fill:none;stroke:var(--fg);stroke-width:1.5;vector-effect:non-scaling-stroke;transition:stroke .6s ease}
  .clock .hand{fill:var(--fg);transition:fill .6s ease}

  /* ---------- footer arrows ---------- */
  .foot{flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 1.3vw 2.6vh}
  .arrow{background:none;border:0;cursor:pointer;color:var(--fg);padding:1vh .8vw;transition:color .6s ease,opacity .3s}
  .arrow svg{width:clamp(36px,3vw,64px);height:auto;display:block}
  .arrow.prev{margin-bottom:.8vh}
  .arrow[disabled]{opacity:0;pointer-events:none}
  .arrow:focus-visible,.tab:focus-visible{outline:2px dashed var(--fg);outline-offset:3px}
  .hint{
    align-self:center;font-weight:300;font-size:clamp(11px,1.5vh,16px);letter-spacing:.08em;
    text-transform:uppercase;opacity:.7;transition:opacity .6s ease;pointer-events:none;
  }
  .hint.gone{opacity:0}

  /* ---------- portrait / phone ---------- */
  @media (max-aspect-ratio: 1/1){
    .edition{padding:3vh 6vw 0}
    #e5 .clock-wrap{align-items:flex-start}
    .clock{width:min(70vw,48vh)}
  }
  @media (prefers-reduced-motion: reduce){
    .list li{animation:none;opacity:1;transform:none}
    .sheet{transition:none}
  }
</style>
</head>

<script>
/* =====================================================================
   NAVIGATIE TUSSEN EDITIES
   ===================================================================== */
const LAST_EDITION = 10;
let edition = -1;  // 0 = HOME, 1–10 = editions
const pad2 = n => String(n).padStart(2,'0');
const infoEl = document.getElementById('info');
const hint = document.getElementById('hint');

const hashFor = n => n === 0 ? '#home' : '#editie-' + pad2(n);
function goTo(n){
  n = Math.min(LAST_EDITION, Math.max(0, n));
  if(location.hash !== hashFor(n)) location.hash = hashFor(n).slice(1);
  else show(n);
}
const sheet = document.getElementById('sheet');
sheet.style.setProperty('--count', LAST_EDITION + 1);   // HOME + 10 editions
let firstShow = true, introDelay = null;
function show(n){
  const from = edition;
  edition = n;
  // glide the sheet to the right part
  sheet.style.transform = `translateX(${-n * 100 / (LAST_EDITION + 1)}%)`;
  if(firstShow){ sheet.getBoundingClientRect(); sheet.classList.remove('instant'); firstShow = false; }
  document.querySelectorAll('.edition').forEach(s => {
    const here = +s.dataset.n === n;
    s.classList.toggle('on', here);
    s.inert = !here;
  });
  // HOME has no arrows (like the design); 01 can glide back to HOME
  document.getElementById('prev').disabled = n === 0;
  document.getElementById('next').disabled = n === 0 || n === LAST_EDITION;
  document.body.classList.remove('dark');
  hint.classList.add('gone');
  infoEl.textContent = n === 0 ? 'INDEX' : 'EDITIE ' + pad2(n);
  if(n === 0) fitIndex();
  clearTimeout(introDelay);
  if(n === 1){
    if(from >= 0 && from !== 1){ stopIntro(); buildIntro(); fitIntro(); introDelay = setTimeout(startIntro, 900); }
    else startIntro();
  }
  // leave the typed text alone when gliding away, so it's still there on the sheet
  if(n === 5) enterClock();
  enterBag(n === 4);
}
function fromHash(){
  if(location.hash === '#home') return show(0);
  const m = /^#editie-(\d{1,2})$/.exec(location.hash);
  show(m ? Math.min(LAST_EDITION, Math.max(1, +m[1])) : 1);
}
addEventListener('hashchange', fromHash);
document.getElementById('next').addEventListener('click', ()=> goTo(edition + 1));
document.getElementById('prev').addEventListener('click', ()=> goTo(edition - 1));
document.getElementById('home').addEventListener('click', e=>{ e.preventDefault(); goTo(0); });

/* ---- HOME: overzicht, elke regel brengt je naar die editie ---- */
const e0 = document.getElementById('e0');
const indexEl = document.getElementById('index');
indexEl.querySelectorAll('button').forEach(b=>{
  const n = +b.dataset.go;
  if(!b.textContent.trim().endsWith('/') ) return;
  b.textContent = b.textContent.trimEnd() + ' COMING SOON';
  b.classList.add('soon-t');
});
indexEl.addEventListener('click', e=>{ const b = e.target.closest('button'); if(b) goTo(+b.dataset.go); });
function fitIndex(){
  const cs = getComputedStyle(e0);
  const availW = e0.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
  const availH = e0.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4;
  let lo = 8, hi = innerHeight * 0.2;
  for(let k=0;k<18;k++){
    const mid = (lo+hi)/2;
    indexEl.style.setProperty('--xfs', mid + 'px');
    (indexEl.scrollWidth <= availW && indexEl.offsetHeight <= availH) ? lo = mid : hi = mid;
  }
  indexEl.style.setProperty('--xfs', lo + 'px');
}

/* =====================================================================
   EDITIE 01 — tekst die letter per letter getypt wordt
   ===================================================================== */
const INTRO = [
  "HELLO!",
  "MY NAME IS DORIEN.",
  "",
  "I MADE A WEBSITE ABOUT",
  "WHATS IN MY BAG.",
  "WANNE SEE?",
  "",
  "#CHOICE#"            // YES / NO
];
const TYPE_MS = 45, LINE_PAUSE = 220, GAP_PAUSE = 380;
const intro = document.getElementById('intro');
const e1 = document.getElementById('e1');
let typeTimer = null, chars = [], noBtn = null, noHome = null;

function spans(text, parent){
  for(const c of text){
    const s = document.createElement('span');
    s.className = 'ch'; s.textContent = c;
    parent.appendChild(s); chars.push(s);
  }
}
function buildIntro(){
  intro.innerHTML = ''; chars = [];
  INTRO.forEach(line=>{
    const ln = document.createElement('span');
    ln.className = 'ln';
    if(line === '') { ln.classList.add('gap'); chars.push('GAP'); }
    else if(line === '#CHOICE#'){
      ln.classList.add('choice');
      const yes = document.createElement('button');
      yes.className = 'yes'; yes.setAttribute('aria-label','Yes');
      spans('YES', yes);
      const mid = document.createElement('span'); mid.className = 'slash';
      spans(' / ', mid);
      noHome = document.createElement('span'); noHome.className = 'no-home';
      noBtn = document.createElement('button');
      noBtn.className = 'no'; noBtn.setAttribute('aria-label','No'); noBtn.tabIndex = -1;
      spans('NO', noBtn);
      noHome.appendChild(noBtn);
      ln.append(yes, mid, noHome);
      yes.addEventListener('click', ()=> goTo(2));
      noBtn.addEventListener('click', e=>{ e.preventDefault(); flee(); });
    }
    else spans(line, ln);
    intro.appendChild(ln);
    chars.push('BR');
  });
}

function fitIntro(){
  const cs = getComputedStyle(e1);
  const availW = e1.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
  const availH = e1.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4;
  let lo = 8, hi = Math.min(innerHeight * 0.095, innerWidth * 0.12);
  for(let k=0;k<18;k++){
    const mid = (lo+hi)/2;
    intro.style.setProperty('--ifs', mid + 'px');
    (intro.scrollWidth <= availW && intro.scrollHeight <= availH) ? lo = mid : hi = mid;
  }
  intro.style.setProperty('--ifs', lo + 'px');
}

function stopIntro(){ clearTimeout(typeTimer); typeTimer = null; }
function startIntro(){
  stopIntro();
  buildIntro();
  intro.classList.add('typing');
  fitIntro();
  const caret = document.createElement('span'); caret.className = 'caret';
  let i = 0;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function step(){
    if(i >= chars.length){ caret.remove(); intro.classList.remove('typing'); typeTimer = null; return; }
    const c = chars[i++];
    if(typeof c === 'string'){ typeTimer = setTimeout(step, reduced ? 0 : (c === 'GAP' ? GAP_PAUSE : LINE_PAUSE)); return; }
    c.classList.add('v');
    c.after(caret);
    typeTimer = setTimeout(step, reduced ? 0 : (c.textContent === ' ' ? TYPE_MS * 0.6 : TYPE_MS + Math.random() * 35));
  }
  typeTimer = setTimeout(step, 350);
}

/* ---- NO loopt weg ---- */
function flee(px, py){
  if(intro.classList.contains('typing')) return;
  const area = e1.getBoundingClientRect();
  const r = noBtn.getBoundingClientRect();
  if(!noBtn.classList.contains('loose')){
    // keep its place in the line, then lift it out
    noHome.style.display = 'inline-block';
    noHome.style.width = r.width + 'px'; noHome.style.height = r.height + 'px';
    noBtn.classList.add('loose');
    noBtn.style.left = (r.left - area.left) + 'px';
    noBtn.style.top  = (r.top  - area.top)  + 'px';
    noBtn.getBoundingClientRect(); // commit start position
  }
  if(px === undefined){ px = r.left + r.width/2; py = r.top + r.height/2; }
  const maxX = area.width - r.width - 6, maxY = area.height - r.height - 6;
  // rectangles of the typed text, so NO doesn't land on top of the words
  const textRects = [];
  intro.querySelectorAll('.ln').forEach(ln=>{
    const rg = document.createRange(); rg.selectNodeContents(ln);
    for(const q of rg.getClientRects()) if(q.width > 2) textRects.push(q);
  });
  const hits = (x,y)=> textRects.some(q=> area.left+x < q.right+8 && area.left+x+r.width > q.left-8 && area.top+y < q.bottom && area.top+y+r.height > q.top);
  let best = null, bestD = -1;
  for(let k=0;k<80;k++){
    const x = 6 + Math.random()*Math.max(0,maxX-6), y = 6 + Math.random()*Math.max(0,maxY-6);
    if(k < 70 && hits(x,y)) continue;
    const d = Math.hypot(area.left + x + r.width/2 - px, area.top + y + r.height/2 - py);
    if(d > bestD){ bestD = d; best = [x,y]; }
    if(d > Math.min(area.width, area.height) * 0.45) break;
  }
  if(!best) best = [6, 6];
  noBtn.style.left = best[0] + 'px';
  noBtn.style.top  = best[1] + 'px';
}
e1.addEventListener('pointermove', e=>{
  if(!noBtn || edition !== 1) return;
  const r = noBtn.getBoundingClientRect();
  const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
  const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
  if(Math.hypot(dx, dy) < Math.max(40, r.height * 0.6)) flee(e.clientX, e.clientY);
});
e1.addEventListener('pointerdown', e=>{
  if(noBtn && (e.target === noBtn || noBtn.contains(e.target))){ e.preventDefault(); flee(e.clientX, e.clientY); }
});
e1.addEventListener('touchstart', e=>{
  if(noBtn && noBtn.contains(e.target)){ e.preventDefault(); const t=e.touches[0]; flee(t.clientX, t.clientY); }
}, { passive:false });

/* =====================================================================
   EDITIE 05 — WAT ZIT ER IN MIJN TAS?  (pas de lijstjes hier aan)
   'from' is het uur (0–23) vanaf wanneer een lijst geldt.
   ===================================================================== */
const BAG = [
  { from: 0,  items: ["WALLET","KEYS","LIPGLOSS","POWERBANK","JACKET"] },               // nog aan het uitgaan
  { from: 3,  items: ["WALLET","KEYS","LIPGLOSS","CRUMPLED RECEIPT"] },                 // thuis, tas op de grond
  { from: 6,  items: ["CHARGER","TOILETRY BAG","COMPUTER","HEADPHONES","BREAKFAST",
                      "WATER BOTTLE","LIPGLOSS","PEN(S)","TISSUES","HAND SANITIZER"] }, // ochtend: school
  { from: 9,  items: ["CHARGER","TOILETRY BAG","COMPUTER","HEADPHONES",
                      "WATER BOTTLE","LIPGLOSS","PEN(S)","TISSUES","HAND SANITIZER"] }, // ontbijt is op
  { from: 12, items: ["CHARGER","TOILETRY BAG","COMPUTER","HEADPHONES","LUNCH",
                      "WATER BOTTLE","LIPGLOSS","PEN(S)","TISSUES","HAND SANITIZER"] }, // middag: lunch erbij
  { from: 16, items: ["CHARGER","TOILETRY BAG","COMPUTER","HEADPHONES","SNACK",
                      "WATER BOTTLE","LIPGLOSS","PEN(S)","TISSUES","HAND SANITIZER"] }, // 16u: snackje
  { from: 20, items: ["WALLET","KEYS","LIPGLOSS","POWERBANK","MAKE UP BAG"] },          // klaarmaken om uit te gaan
  { from: 22, items: ["WALLET","KEYS","LIPGLOSS","POWERBANK","JACKET"] },               // uitgaan, kleine tas
];
const DARK_FROM = 20, LIGHT_FROM = 8;   // donker 20:00–08:00, licht 08:00–20:00
const LAST_MINUTE = 23 * 60 + 59;

const e5 = document.getElementById('e5');
const listEl = document.getElementById('list');
const minuteHand = document.getElementById('minute');
const hourHand = document.getElementById('hour');
let shownBlock = -1, lastMinutes = -1, target = 0, current = 0, raf = 0;

function blockFor(hour){ let idx = 0; BAG.forEach((b,i)=>{ if(hour >= b.from) idx = i; }); return idx; }

function renderList(idx, measuring){
  const items = BAG[idx].items;
  listEl.innerHTML = '';
  items.forEach((name,i)=>{
    const li = document.createElement('li');
    if(measuring) li.style.animation = 'none'; else li.style.animationDelay = (i*35)+'ms';
    li.textContent = name;
    if(!(i === items.length - 1 && items.length > 6)){
      const s = document.createElement('span'); s.className = 'slash'; s.textContent = '/';
      li.append(' ', s);
    }
    listEl.appendChild(li);
  });
}

/* biggest font size at which every hour's list fits inside the frame */
function fitList(){
  if(edition !== 5) return;
  const cs = getComputedStyle(e5);
  const availH = e5.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4;
  const availW = e5.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
  const cap = innerWidth <= innerHeight ? innerWidth * 0.075 : Math.min(innerHeight * 0.062, innerWidth * 0.034);
  let lo = 8, hi = Math.max(8, cap);
  for(let k=0;k<18;k++){
    const mid = (lo+hi)/2;
    listEl.style.setProperty('--fs', mid + 'px');
    let ok = true;
    for(let i=0;i<BAG.length && ok;i++){
      renderList(i, true);
      if(listEl.offsetHeight > availH || listEl.offsetWidth > availW) ok = false;
    }
    ok ? lo = mid : hi = mid;
  }
  listEl.style.setProperty('--fs', lo + 'px');
  renderList(shownBlock < 0 ? 0 : shownBlock);
}

function draw(total, force){
  total = Math.round(total);
  if(total === lastMinutes && !force) return;
  lastMinutes = total;
  const h = Math.floor(total / 60), m = total % 60;
  minuteHand.setAttribute('transform', `rotate(${m * 6})`);
  hourHand.setAttribute('transform', `rotate(${(h % 12) * 30 + m * 0.5})`);
  if(edition !== 5) return;
  infoEl.textContent = pad2(h) + ':' + pad2(m);
  document.body.classList.toggle('dark', h >= DARK_FROM || h < LIGHT_FROM);
  const idx = blockFor(h);
  if(idx !== shownBlock){ shownBlock = idx; renderList(idx); }
  hint.classList.toggle('gone', total > 20);
}
function enterClock(){ fitList(); shownBlock = -1; draw(current, true); }

function tick(){
  current += (target - current) * 0.25;
  if(Math.abs(target - current) < 0.5) current = target;
  draw(current);
  raf = current === target ? 0 : requestAnimationFrame(tick);
}
function setTarget(v){ target = Math.min(LAST_MINUTE, Math.max(0, v)); if(!raf) raf = requestAnimationFrame(tick); }

/* scroll / swipe / keys turn the clock — only in editie 05 */
const MIN_PER_PX = 0.25;   // ±25 minuten per tik van het muiswieltje
addEventListener('wheel', e=>{
  e.preventDefault();
  if(edition !== 5) return;
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
  setTarget(target + (e.deltaY || e.deltaX) * unit * MIN_PER_PX);
}, { passive:false });
let touchY = null;
addEventListener('touchstart', e=>{ touchY = e.touches[0].clientY; }, { passive:true });
addEventListener('touchmove', e=>{
  if(edition !== 5 || touchY === null) return;
  const y = e.touches[0].clientY;
  setTarget(target + (touchY - y) * 1.2);
  touchY = y; e.preventDefault();
}, { passive:false });
addEventListener('touchend', ()=>{ touchY = null; });
addEventListener('keydown', e=>{
  if(edition !== 5) return;
  const step = { ArrowDown:5, ArrowUp:-5, PageDown:60, PageUp:-60, ' ':60 }[e.key];
  if(e.key === 'Home'){ e.preventDefault(); setTarget(0); }
  else if(e.key === 'End'){ e.preventDefault(); setTarget(LAST_MINUTE); }
  else if(step){ e.preventDefault(); setTarget(target + step); }
});

addEventListener('resize', ()=>{ if(edition === 1){ fitIntro(); } fitList(); fitIndex(); });
if(document.fonts) document.fonts.ready.then(()=>{ if(edition === 1) fitIntro(); fitList(); fitIndex(); });

/* =====================================================================
   EDITIE 04 — DE HANDELING
   Typ met je toetsenbord: het woord verschijnt bij je cursor.
   ENTER = het item valt in de tas (altijd binnen de buitenste lijn).
   ===================================================================== */
const BAG_W = 1915, BAG_H = 1289;
const MASK = (()=>{                       // 1 = binnen in de tas (met marge tot de lijn)
  const [gw, gh, cell, b64] = '240,162,8,AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf/4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf/+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA///AAAAAAAAAAAAAAAAAADgAAAAAAAAAAAAAAAAA///wAAAAAAAAAAAAAAAAAf8AAAAAAAAAAAAAAAAB///4AAAAAAAAAAAAAAAAB//AAAAAAAAAAAAAAAAB///8AAAAAAAAAAAAAAAAH//gAAAAAAAAAAAAAAAD///+AAAAAAAAAAAAAAAAP//4AAAAAAAAAAAAAAAD////AAAAAAAAAAAAAAAA///8AAAAAAAAAAAAAAAH////gAAAAAAAAAAAAAAB///+AAAAAAAAAAAAAAAP////wAAAAAAAAAAAAAAD////gAAAAAAAAAAAAAAP////4AAAAAAAAAAAAAAH////wAAAAAAAAAAAAAAf////4AAAAAAAAAAAAAAP////4AAAAAAAAAAAAAAf////8AAAAAAAAAAAAAAP////8AAAAAAAAAAAAAA/////8AAAAAAAAAAAAAAf////8AAAAAAAAAAAAAA/////+AAAAAAAAAAAAAA/////+AAAAAAAAAAAAAA/////+AAAAAAAAAAAAAA//////AAAAAAAAAAAAAA//////AAAAAAAAAAAAAB//////AAAAAAAAAAAAAA//////AAAAAAAAAAAAAB//////gAAAAAAAAAAAAA//////AAAAAAAAAAAAAD//////gAAAAAAAAAAAAB//////gAAAAAAAAAAAAD//////4AAAAAAAAAAAAB//////gAAAAAAAAAAAAD//////+AAAAAAAAAAAAB//////gAAAAAAAAAAAAH//////+AAAAAAAAAAAAD//////gAAAAAAAAAAAAH///////AAAAAAAAAAfAP//////wAAAAAAAAAAAAP///////AAAAAAAAAA/////////wAAAAAB/wAAAAP///////gAOAAAAAAB/////////4AAAAB///AAAAf//////////gAAAAAD/////////4AAAAD///8AAB///////////4AAAAAD/////////8AAAAD////wAP///////////4AAAAAH/////////8AAAAP//////////////////8AAAAAH/////////////////////////////////+AAAAAP/////////////////////////////////+AAAAAP//////////////////////////////////AAAAAP//////////////////////////////////AAAAAP//////////////////////////////////gAAAAf//////////////////////////////////gAAAAf//////////////////////////////////wAAAAf//////////////////////////////////wAAAAf//////////////////////////////////wAAAAf//////////////////////////////////wAAAA///////////////////////////////////4AAAA///////////////////////////////////4AAAA///////////////////////////////////4AAAA///////////////////////////////////4AAAB///////////////////////////////////8AAAB///////////////////////////////////8AAAB///////////////////////////////////8AAAB///////////////////////////////////8AAAD///////////////////////////////////+AAAD///////////////////////////////////+AAAD///////////////////////////////////+AAAD///////////////////////////////////+AAAD////////////////////////////////////AAAH////////////////////////////////////AAAH////////////////////////////////////AAAH////////////////////////////////////AAAH////////////////////////////////////AAAH////////////////////////////////////gAAP////////////////////////////////////gAAP////////////////////////////////////gAAP////////////////////////////////////gAAP////////////////////////////////////wAAP////////////////////////////////////wAAf////////////////////////////////////wAAf////////////////////////////////////wAAf////////////////////////////////////wAAf////////////////////////////////////wAAf////////////////////////////////////4AA/////////////////////////////////////4AA/////////////////////////////////////4AA/////////////////////////////////////4AA/////////////////////////////////////4AA/////////////////////////////////////4AA/////////////////////////////////////8AA/////////////////////////////////////8AB/////////////////////////////////////8AB/////////////////////////////////////8AB/////////////////////////////////////+AB/////////////////////////////////////+AB/////////////////////////////////////+AB//////////////////////////////////////AB//////////////////////////////////////AB//////////////////////////////////////AD//////////////////////////////////////gD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////wD//////////////////////////////////////wD//////////////////////////////////////wD//////////////////////////////////////wD//////////////////////////////////////wD//////////////////////////////////////wD//////////////////////////////////////wD//////////////////////////////////////wD//////////////////////////////////////wD//////////////////////////////////////wD//////////////////////////////////////wD//////////////////////////////////////wD//////////////////////////////////////wD//////////////////////////////////////wB//////////////////////////////////////wB//////////////////////////////////////wB//////////////////////////////////////wB//////////////////////////////////////wB//////////////////////////////////////wB//////////////////////////////////////wB//////////////////////////////////////wB//////////////////////////////////////wB//////////////////////////////////////wB//////////////////////////////////////wB//////////////////////////////////////wD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////gD//////////////////////////////////////AD//////////////////////////////////////AD//////////////////////////////////////AD/////////////////////////////////////+AD/////////////////////////////////////+AD/////////////////////////////////////+AD////////////////////4AAAAAAAD////////8AA///////////4AAAAAAAAAAAAAAAAAB///////AAAAAAAAAAP//wAAAAAAAAAAAAAAAAAAAB/////gAAAAAAAAAAAPwAAAAAAAAAAAAAAAAAAAAAAQD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'.split(',');
  const raw = atob(b64), bits = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) bits[i] = raw.charCodeAt(i);
  return { gw:+gw, gh:+gh, cell:+cell, bits };
})();
function inBag(x, y){
  const gx = Math.floor(x / MASK.cell), gy = Math.floor(y / MASK.cell);
  if(gx < 0 || gy < 0 || gx >= MASK.gw || gy >= MASK.gh) return false;
  const i = gy * MASK.gw + gx;
  return (MASK.bits[i >> 3] >> (7 - (i & 7))) & 1;
}

const e4 = document.getElementById('e4');
const bagEl = document.getElementById('bag');
const wordsEl = document.getElementById('words');
const typingNow = document.getElementById('typingNow');
const typeInput = document.getElementById('typeInput');
const emptyBtn = document.getElementById('emptyBtn');
const measureCtx = document.createElement('canvas').getContext('2d');
const placed = [];                         // {cx,cy,w,h,a} in bag units
let pointer = null;

function enterBag(on){
  emptyBtn.hidden = !on;
  if(on){
    if(!pointer){ const r = e4.getBoundingClientRect(); pointer = { x: r.width * 0.5, y: r.height * 0.88 }; }
    renderTyping();
    setTimeout(()=>{ if(edition === 4) typeInput.focus({ preventScroll:true }); }, 950);
  } else typeInput.blur();
}

function renderTyping(){
  const txt = typeInput.value.toUpperCase();
  typingNow.innerHTML = '';
  if(txt) typingNow.append(txt);
  else { const ph = document.createElement('span'); ph.className = 'ph'; ph.textContent = 'TYPE AN ITEM + ENTER'; typingNow.append(ph); }
  const c = document.createElement('span'); c.className = 'caret';
  txt ? typingNow.append(c) : typingNow.prepend(c);
  typingNow.style.left = pointer.x + 'px';
  typingNow.style.top = pointer.y + 'px';
}

e4.addEventListener('pointermove', e=>{
  const r = e4.getBoundingClientRect();
  pointer = { x: e.clientX - r.left, y: e.clientY - r.top };
  typingNow.style.left = pointer.x + 'px';
  typingNow.style.top = pointer.y + 'px';
});
e4.addEventListener('pointerdown', e=>{
  e.preventDefault();                         // keep focus in the hidden input
  const r = e4.getBoundingClientRect();
  pointer = { x: e.clientX - r.left, y: e.clientY - r.top };
  renderTyping();
  typeInput.focus({ preventScroll:true });   // opens the keyboard on a phone
});
typeInput.addEventListener('input', ()=>{
  typeInput.value = typeInput.value.replace(/\n/g,'').slice(0, 28);
  renderTyping();
});
typeInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); commitWord(); }
  else if(e.key === 'Escape'){ typeInput.value = ''; renderTyping(); }
  e.stopPropagation();
});

/* corners + sample points of a rotated box */
function boxPoints(cx, cy, w, h, a, nx = 7, ny = 3){
  const cos = Math.cos(a), sin = Math.sin(a), pts = [];
  for(let i=0;i<=nx;i++) for(let j=0;j<=ny;j++){
    const lx = (i/nx - .5) * w, ly = (j/ny - .5) * h;
    pts.push([cx + lx*cos - ly*sin, cy + lx*sin + ly*cos]);
  }
  return pts;
}
function insideBox(px, py, b){
  const dx = px - b.cx, dy = py - b.cy, cos = Math.cos(-b.a), sin = Math.sin(-b.a);
  const lx = dx*cos - dy*sin, ly = dx*sin + dy*cos;
  return Math.abs(lx) < b.w/2 && Math.abs(ly) < b.h/2;
}

/* find a spot fully inside the bag, preferring spots that don't cover other words */
function findSpot(text){
  for(let fs = 170; fs >= 40; fs *= 0.86){
    measureCtx.font = `400 ${fs}px Archivo, Helvetica, Arial, sans-serif`;
    const w = measureCtx.measureText(text).width * 0.99, h = fs * 0.78;
    let best = null, bestHits = Infinity;
    for(let k=0;k<500;k++){
      const a = (Math.random() * 130 - 65) * Math.PI / 180;
      const cx = Math.random() * BAG_W, cy = Math.random() * BAG_H;
      const pts = boxPoints(cx, cy, w, h, a, Math.max(6, Math.ceil(w / 90)), 3);
      if(!pts.every(p => inBag(p[0], p[1]))) continue;
      let hits = 0;
      for(const b of placed) for(const p of pts) if(insideBox(p[0], p[1], b)) hits++;
      if(hits < bestHits){ bestHits = hits; best = { cx, cy, w, h, a, fs }; if(hits === 0) break; }
    }
    if(best && (bestHits === 0 || fs < 70)) return best;
  }
  return null;
}

function commitWord(){
  const text = typeInput.value.trim().toUpperCase().replace(/\s+/g,' ');
  if(!text) return;
  typeInput.value = '';
  renderTyping();
  const spot = findSpot(text);
  if(!spot){ typingNow.animate([{transform:'translate(12px,-50%)'},{transform:'translate(24px,-50%)'},{transform:'translate(12px,-50%)'}],{duration:250}); return; }
  placed.push(spot);

  const el = document.createElement('div');
  el.className = 'word';
  el.textContent = text;
  // start where you typed it…
  const br = bagEl.getBoundingClientRect(), er = e4.getBoundingClientRect();
  const sx = (er.left + pointer.x - br.left) / br.width * 100;
  const sy = (er.top + pointer.y - br.top) / br.height * 100;
  const startFs = parseFloat(getComputedStyle(typingNow).fontSize) / br.width * 100;
  el.style.left = sx + '%'; el.style.top = sy + '%';
  el.style.fontSize = startFs + 'cqw';
  el.style.setProperty('--r', '0deg');
  wordsEl.appendChild(el);
  el.getBoundingClientRect();
  // …then it drops into the bag
  el.style.left = spot.cx / BAG_W * 100 + '%';
  el.style.top = spot.cy / BAG_H * 100 + '%';
  el.style.fontSize = spot.fs / BAG_W * 100 + 'cqw';
  el.style.setProperty('--r', spot.a * 180 / Math.PI + 'deg');
}

// typing anywhere on editie 04 goes to the bag, even if focus wandered off
addEventListener('keydown', e=>{
  if(edition !== 4 || document.activeElement === typeInput || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key.length === 1 || e.key === 'Backspace' || e.key === 'Enter') typeInput.focus({ preventScroll:true });
}, true);

emptyBtn.addEventListener('click', ()=>{
  placed.length = 0;
  [...wordsEl.children].forEach((el, i)=>{
    setTimeout(()=> el.classList.add('out'), i * 40);
    setTimeout(()=> el.remove(), 800 + i * 40);
  });
  typeInput.focus({ preventScroll:true });
});

fromHash();
</script>
