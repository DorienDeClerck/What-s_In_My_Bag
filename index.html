<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello!</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
  }
  body {
    box-sizing: border-box;
    padding: 6px;
  }
  .scherm {
    height: 100%;
    background: #1c05f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 8vh;
    box-sizing: border-box;
    overflow: hidden;
  }

  h1 {
    font-family: "Pinyon Script", cursive;
    font-weight: 400;
    font-size: clamp(80px, 14vw, 220px);
    color: #fff;
    margin: 0 0 4vh;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  h1.zichtbaar { opacity: 1; }

  .regel {
    display: flex;
    margin-bottom: 24px;
    min-height: 1.2em;
    font-family: "DotGothic16", monospace;
    font-size: clamp(24px, 3.5vw, 52px);
  }
  .letter {
    display: inline-block;
    width: 0.66em;
    height: 1.2em;
    line-height: 1.2em;
    text-align: center;
    background: #fff;
    color: #1c05f5;
    border-right: 1px solid #1c05f5;
    box-sizing: border-box;
  }
</style>
</head>
<body>
  <div class="scherm">
    <h1 id="hello">Hello!</h1>
    <div id="tekst"></div>
  </div>

<script>
  // ====== INSTELLINGEN ======
  const regels = [
    "My name is Dorien",
    "I made a website!!!!!!!",
    "Wanne see??"
  ];
  const typSnelheid     = 90;    // ms per letter
  const leesTijd        = 2500;  // ms pauze na elke regel
  const startVertraging = 1800;  // ms na "Hello!" voor de eerste regel
  // ===========================

  const wacht = ms => new Promise(r => setTimeout(r, ms));
  const container = document.getElementById("tekst");

  async function typRegel(tekst) {
    const regel = document.createElement("div");
    regel.className = "regel";
    container.appendChild(regel);

    for (const teken of tekst) {
      const span = document.createElement("span");
      span.className = "letter";
      span.textContent = teken === " " ? "\u00A0" : teken;
      regel.appendChild(span);
      await wacht(typSnelheid);
    }
  }

  async function start() {
    await wacht(500);
    document.getElementById("hello").classList.add("zichtbaar");
    await wacht(startVertraging);

    for (const regel of regels) {
      await typRegel(regel);
      await wacht(leesTijd);
    }
  }

  start();
</script>
</body>
</html>
